  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // Done on elements: cutting the markup text could rejoin a split closing tag.
    const stripPins = (root) => {
      for (const el of root.querySelectorAll('[integrity], [crossorigin], template')) {
        el.removeAttribute('integrity');
        el.removeAttribute('crossorigin');
        if (el.localName === 'template' && el.content) stripPins(el.content);
      }
    };
    stripPins(doc);
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ning',\n    halvRewardLab: 'reward',\n    halvDesc: 'Every 210,000 blocks (~4 years), new BTC issuance is cut in half. Major bull cycles have historically unfolded 12–18 months after each halving.',\n    dataLab: 'data from',\n    locale: 'en-US'\n  }\n};\n\nlet lang = 'pt';\ntry { lang = localStorage.getItem('btc_portfolio_lang') || 'pt'; } catch(e) {}\nif (!I18N[lang]) lang = 'pt';\n\nfunction t(key) { return I18N[lang][key]; }\n\nfunction applyLang() {\n  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';\n  document.title = t('logo');\n  document.getElementById('t-logo').textContent = t('logo');\n  document.getElementById('t-total').textContent = t('total');\n  document.getElementById('t-balances').textContent = t('balances');\n  document.getElementById('t-wallets').textContent = t('wallets');\n  document.getElementById('w-name').placeholder = t('walletNamePh');\n  document.getElementById('t-add-wallet').textContent = editingWalletForm ? t('updateBtn') : t('addWalletBtn');\n  document.getElementById('t-loans').textContent = t('loans');\n  document.getElementById('t-new-loan').textContent = t('newLoanBtn');\n  document.getElementById('t-l-name').textContent = t('lName');\n  document.getElementById('loan-name').placeholder = t('lNamePh');\n  document.getElementById('t-l-coll').textContent = t('lColl');\n  document.getElementById('t-l-usd').textContent = t('lUsd');\n  document.getElementById('t-l-price').textContent = t('lPrice');\n  document.getElementById('loan-price').placeholder = t('lPricePh');\n  document.getElementById('t-l-apr').textContent = t('lApr');\n  document.getElementById('t-l-liq').textContent = t('lLiq');\n  document.getElementById('loan-liq').placeholder = t('lLiqPh');\n  document.getElementById('t-l-date').textContent = t('lDate');\n  document.getElementById('t-l-time').textContent = t('time');\n  document.getElementById('t-add-loan').textContent = editingLoan ? t('updateBtn') : t('addLoanBtn');\n  document.getElementById('backup-msg').textContent = t('noAutoSave');\n  document.getElementById('t-alloc').textContent = t('alloc');\n  document.getElementById('t-chart').textContent = t('chart');\n  const tfLabels = { '4h': '4H', '1d': t('daily'), '1w': t('weekly'), '1M': t('monthly') };\n  document.querySelectorAll('.tf-btn').forEach(b => {\n    b.textContent = tfLabels[b.dataset.tf] || b.dataset.tf;\n  });\n  document.getElementById('zoom-out').title = t('zoomMore');\n  document.getElementById('zoom-in').title = t('zoomLess');\n  document.getElementById('t-show-trades').textContent = t('showTrades');\n  document.getElementById('t-newtx').textContent = t('newTx');\n  document.getElementById('t-type').textContent = t('type');\n  document.getElementById('t-qty').textContent = t('qty');\n  document.getElementById('t-date').textContent = t('date');\n  document.getElementById('t-time').textContent = t('time');\n  document.getElementById('t-note').textContent = t('note');\n  document.getElementById('tx-note').placeholder = t('notePh');\n  document.getElementById('t-add-btn').textContent = editingTx ? t('updateBtn') : t('addBtn');\n  document.getElementById('t-history').textContent = t('history');\n  updateDirtyDot();\n  document.getElementById('t-import-btn').textContent = t('importBtn');\n  document.getElementById('t-csv-btn').textContent = t('csvBtn');\n  document.getElementById('priv-btn').title = t('privTip');\n  document.getElementById('refresh-btn').title = t('refresh');\n  document.getElementById('t-tab-portfolio').textContent = t('tabPortfolio');\n  document.getElementById('t-tab-indicators').textContent = t('tabIndicators');\n  if (typeof applyCalcLang === 'function') applyCalcLang();\n  if (typeof applySpiralLang === 'function') applySpiralLang();\n  document.getElementById('t-ind-refresh').textContent = t('indRefresh');\n  if (typeof IND !== 'undefined' && (IND.loaded || IND.loading)) renderIndicatorCards();\n\n  const sel = document.getElementById('tx-type');\n  sel.options[0].textContent = t('typeBuy');\n  sel.options[1].textContent = t('typeSell');\n  sel.options[2].textContent = t('typeDepBtc');\n  sel.options[3].textContent = t('typeDepUsd');\n  sel.options[4].textContent = t('labLoan');\n  sel.options[5].textContent = t('typeWdUsd');\n  sel.options[6].textContent = t('typeWdBtc');\n  sel.options[7].textContent = t('typeTransfer');\n  const tto = document.getElementById('t-to'); if (tto) tto.textContent = t('toLabel');\n  onTypeChange();\n\n  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));\n  onTypeChange();\n  render();\n  if (!editingWallet) renderWallets();\n  renderLoans();\n  drawAll();\n}\n\nfunction setLang(l) {\n  lang = l;\n  try { localStorage.setItem('btc_portfolio_lang', l); } catch(e) {}\n  applyLang();\n}\n\n/* ── State ────────────────────────────────── */\nlet btcPriceUSD = 0;\nlet brlRate = 5.75;\nlet unit = 'BTC';\ntry { unit = localStorage.getItem('btc_portfolio_unit') || 'BTC'; } catch (e) {}\nif (!['BTC', 'SATS', 'USD', 'BRL'].includes(unit)) unit = 'BTC';\nlet transactions = [];\nlet manualBal = { btc: null, usd: null };\nlet dirty = false;\n\ntry {\n  const s = localStorage.getItem('btc_portfolio_v3');\n  if (s) transactions = JSON.parse(s);\n} catch(e) {}\n\ntry {\n  const m = localStorage.getItem('btc_portfolio_manual');\n  if (m) manualBal = JSON.parse(m);\n} catch(e) {}\n\nfunction save() { dirty = true; updateDirtyDot(); }\n\nfunction saveManualBal() { dirty = true; updateDirtyDot(); }\n\n/* Wallets */\nlet wallets = [];\ntry {\n  const w = localStorage.getItem('btc_portfolio_wallets');\n  if (w) wallets = JSON.parse(w);\n} catch (e) {}\n\nlet editingWallet = null;\n\nfunction saveWallets() { dirty = true; updateDirtyDot(); }\n\nfunction escapeHtml(s) {\n  return String(s).replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n}\n\nfunction renderWallets() {\n  const el = document.getElementById('wallet-list');\n  if (!el) return;\n  const p = calcPortfolio();\n  const sum = wallets.reduce((s, w) => s + (parseFloat(w.btc) || 0), 0);\n  const totalBtc = p.btcBal;\n\n  if (!wallets.length && !loans.length) {\n    el.innerHTML = '<div class=\"wallet-empty\">' + t('walletsEmpty') + '<\u002Fdiv>';\n    return;\n  }\n\n  const loanNameSet = new Set(loans.map(L => (L.name || t('labLoan')).trim().toLowerCase()).filter(Boolean));\n\n  let html = [...wallets].sort((a, b) => (parseFloat(b.btc) || 0) - (parseFloat(a.btc) || 0)).map(w => {\n    const btc = parseFloat(w.btc) || 0;\n    const dupLoan = loanNameSet.has((w.name || '').trim().toLowerCase());\n    const pct = totalBtc > 0 ? (btc / totalBtc * 100) : 0;\n    const amt = editingWallet === w.id\n      ? `<input class=\"bal-input\" id=\"w-input-${w.id}\" type=\"number\" step=\"0.00000001\" value=\"${btc}\" onblur=\"commitWallet('${w.id}')\" onkeydown=\"balKey(event)\" style=\"font-size:13px;padding:4px 8px;max-width:140px;\" />`\n      : `<span class=\"bal-amt-text\" onclick=\"startEditWallet('${w.id}')\" title=\"${t('editTip')}\">${fBTC(btc)}<\u002Fspan>`;\n    return `<div class=\"wallet-item ${btc < 0 ? 'neg-wallet' : ''} ${dupLoan ? 'dup-wallet' : ''}\">\n      <div>\n        <div class=\"wallet-name\">${escapeHtml(w.name)}${dupLoan ? `<span class=\"dup-tag\" title=\"${t('dupLoanTip')}\">${t('dupLoanTag')}<\u002Fspan>` : ''}<\u002Fdiv>\n        <div class=\"wallet-pct\">${pct.toFixed(1)}%<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"wallet-amts\">\n        <div class=\"wallet-btc\">${amt}<\u002Fdiv>\n        <div class=\"wallet-equiv\">${btcPriceUSD > 0 ? fVal(btc * btcPriceUSD) : ''}<\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"tx-del\" onclick=\"editWalletRow('${w.id}')\" title=\"✎\">✎<\u002Fbutton>\n      <button class=\"tx-del\" onclick=\"deleteWallet('${w.id}')\" title=\"✕\">✕<\u002Fbutton>\n    <\u002Fdiv>`;\n  }).join('');\n\n  const rest = 0;\n\n  /* loan equity rows — grouped by name, net = collateral − debt */\n  if (loans.length) {\n    const groups = {};\n    for (const L of loans) {\n      const nm = (L.name || t('labLoan')).trim();\n      const key = nm.toLowerCase();\n      if (!groups[key]) groups[key] = { name: nm, coll: 0, debt: 0, n: 0 };\n      const c = loanCalc(L);\n      groups[key].coll += c.collateral;\n      groups[key].debt += c.debt;\n      groups[key].n++;\n    }\n    html += Object.values(groups).map(g => {\n      const netBtc = btcPriceUSD > 0 ? g.coll - g.debt / btcPriceUSD : null;\n      const pct = totalBtc > 0 ? (g.coll / totalBtc * 100) : 0;\n      return `<div class=\"wallet-item wallet-loan\">\n        <div><div class=\"wallet-name\">${escapeHtml(g.name)}${g.n > 1 ? ' <span class=\"loan-x\">×' + g.n + '<\u002Fspan>' : ''}<span class=\"loan-tag\">${t('loanTagLab')} · ${t('inCollateral')}<\u002Fspan><\u002Fdiv>\n          <div class=\"wallet-pct\">${pct.toFixed(1)}% · ${t('debtShort')} ${fUSD(g.debt)}${netBtc != null ? ' · ' + t('netShort') + ' ' + fBTC(netBtc) : ''}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"wallet-amts\">\n          <div class=\"wallet-btc\">${fBTC(g.coll)}<\u002Fdiv>\n          <div class=\"wallet-equiv\">${btcPriceUSD > 0 ? fVal(g.coll * btcPriceUSD) : ''}<\u002Fdiv>\n        <\u002Fdiv>\n        <div><\u002Fdiv>\n        <div><\u002Fdiv>\n      <\u002Fdiv>`;\n    }).join('');\n  }\n\n  el.innerHTML = html;\n  const inp = editingWallet != null ? document.getElementById('w-input-' + editingWallet) : null;\n  if (inp) { inp.focus(); inp.select(); }\n}\n\nfunction addWallet() {\n  const nameEl = document.getElementById('w-name');\n  const btcEl = document.getElementById('w-btc');\n  const name = nameEl.value.trim();\n  const btc = parseFloat(btcEl.value);\n  if (!name || isNaN(btc) || btc < 0) return;\n  if (editingWalletForm) {\n    const w = wallets.find(x => x.id === editingWalletForm);\n    if (w) {\n      const oldKey = (w.name || '').trim().toLowerCase();\n      if (oldKey && oldKey !== name.toLowerCase()) {\n        // renomeia também nas transações, para editar/apagar continuar caindo na mesma custódia\n        transactions.forEach(tx => {\n          if ((tx.note || '').trim().toLowerCase() === oldKey) tx.note = name;\n          if ((tx.to || '').trim().toLowerCase() === oldKey) tx.to = name;\n        });\n        save();\n      }\n      w.name = name; w.btc = btc;\n    }\n    editingWalletForm = null;\n    document.getElementById('t-add-wallet').textContent = t('addWalletBtn');\n  } else {\n    wallets.push({ id: Date.now().toString(), name, btc });\n  }\n  saveWallets();\n  nameEl.value = '';\n  btcEl.value = '';\n  renderWallets();\n}\n\n// A custódia é a fonte da verdade: toda transação de BTC precisa cair em algum lugar.\n// Nome exato casa com a custódia; nome novo cria a custódia; sem nome vai para \"Não alocado\".\nfunction unallocatedWallet(create) {\n  const key = t('unallocated').trim().toLowerCase();\n  let w = wallets.find(x => (x.name || '').trim().toLowerCase() === key);\n  if (!w && create) { w = { id: 'unalloc-' + Date.now(), name: t('unallocated'), btc: 0 }; wallets.push(w); }\n  return w;\n}\n\n// Movimentos de uma transação na custódia: lista de [nome, delta BTC].\nfunction txCustodyMoves(tx) {\n  const btc = parseFloat(tx.btc) || 0;\n  if (!btc) return [];\n  if (tx.type === 'buy' || tx.type === 'deposit_btc' || tx.type === 'loan') return [[tx.note, btc]];\n  if (tx.type === 'sell' || tx.type === 'withdraw_btc') return [[tx.note, -btc]];\n  if (tx.type === 'transfer') return [[tx.note, -(btc + (parseFloat(tx.fee) || 0))], [tx.to, btc]];\n  return [];\n}\n\n// Aplica (sign=1) ou desfaz (sign=-1) o efeito de uma transação na custódia.\n// Nome exato casa com a custódia; nome novo cria; sem nome vai para \"Não alocado\".\nfunction applyCustody(tx, sign) {\n  const moves = txCustodyMoves(tx);\n  if (!moves.length) return;\n  for (const [nm, d] of moves) {\n    const delta = d * sign;\n    if (!delta) continue;\n    const note = (nm || '').trim();\n    const key = note.toLowerCase();\n    let w = key ? wallets.find(x => (x.name || '').trim().toLowerCase() === key) : null;\n    if (!w) {\n      if (key && delta > 0) { w = { id: 'w-' + Date.now() + Math.random().toString(36).slice(2, 6), name: note, btc: 0 }; wallets.push(w); }\n      else w = unallocatedWallet(true);\n    }\n    w.btc = (parseFloat(w.btc) || 0) + delta;\n  }\n  saveWallets();\n}\n\n// Validação comum ao formulário e à edição inline. Retorna a chave de erro ou null.\nfunction txError(o) {\n  const needBtc = ['buy', 'sell', 'loan', 'deposit_btc', 'withdraw_btc', 'transfer'];\n  if (needBtc.includes(o.type) && o.btc <= 0) return 'errQty';\n  if ((o.type === 'buy' || o.type === 'sell' || o.type === 'loan') && o.price <= 0) return 'errPrice';\n  if ((o.type === 'deposit_usd' || o.type === 'withdraw_usd') && o.price <= 0) return 'errValue';\n  if (o.type === 'transfer' && (!o.note || !o.to || o.note.toLowerCase() === o.to.toLowerCase())) return 'errTo';\n  return null;\n}\n\nlet editingWalletForm = null;\n\nfunction editWalletRow(id) {\n  const w = wallets.find(x => x.id === id);\n  if (!w) return;\n  editingWalletForm = id;\n  document.getElementById('w-name').value = w.name;\n  document.getElementById('w-btc').value = w.btc;\n  document.getElementById('t-add-wallet').textContent = t('updateBtn');\n  document.getElementById('w-name').focus();\n}\n\nfunction startEditWallet(id) {\n  editingWallet = id;\n  editCancelled = false;\n  renderWallets();\n}\n\nfunction commitWallet(id) {\n  const input = document.getElementById('w-input-' + id);\n  if (!editCancelled && input && input.value !== '') {\n    const val = parseFloat(input.value);\n    if (!isNaN(val)) {\n      const w = wallets.find(x => x.id === id);\n      if (w) { w.btc = val; saveWallets(); }\n    }\n  }\n  editingWallet = null;\n  editCancelled = false;\n  renderWallets();\n}\n\nfunction deleteWallet(id) {\n  const dw = wallets.find(w => w.id === id);\n  const amt = dw ? parseFloat(dw.btc) || 0 : 0;\n  if (!confirm(Math.abs(amt) > 1e-9 ? t('confirmDelWalletAmt').replace('{btc}', fBTC(amt)) : t('confirmDelWallet'))) return;\n  wallets = wallets.filter(w => w.id !== id);\n  saveWallets();\n  renderWallets();\n}\n\n/* Loans (BTC-collateralized) */\nlet loans = [];\ntry {\n  const l = localStorage.getItem('btc_portfolio_loans');\n  if (l) loans = JSON.parse(l);\n} catch (e) {}\n\nfunction saveLoans() { dirty = true; updateDirtyDot(); }\n\n/* Normaliza IDs: garante que toda transação/carteira/empréstimo tenha um id\n   de TEXTO único. Corrige dados de backups antigos (id numérico, ausente ou\n   duplicado), que quebravam a edição inline (o botão ✎ passa o id como string). */\nlet _idSeq = 0;\nfunction normalizeIds() {\n  const fix = (arr) => {\n    if (!Array.isArray(arr)) return;\n    const seen = new Set();\n    for (const item of arr) {\n      if (!item || typeof item !== 'object') continue;\n      let id = item.id;\n      if (id === null || id === undefined || id === '' || seen.has(String(id))) {\n        id = Date.now().toString() + '-' + (_idSeq++);\n      }\n      item.id = String(id);\n      seen.add(item.id);\n    }\n  };\n  fix(transactions);\n  fix(wallets);\n  fix(loans);\n}\nnormalizeIds();\n\n/* Migração única: dados agora vivem APENAS em memória + arquivos de backup */\ntry {\n  ['btc_portfolio_v3', 'btc_portfolio_manual', 'btc_portfolio_wallets', 'btc_portfolio_loans'].forEach(k => localStorage.removeItem(k));\n} catch (e) {}\nif (transactions.length || wallets.length || loans.length || manualBal.btc !== null || manualBal.usd !== null) dirty = true;\n\nfunction toggleLoanForm() {\n  const f = document.getElementById('loan-form');\n  f.style.display = f.style.display === 'none' ? 'block' : 'none';\n}\n\nfunction loanCalc(L) {\n  const collateral = parseFloat(L.collateral) || 0;\n  const principal = parseFloat(L.principal) || 0;\n  const loanPrice = parseFloat(L.loanPrice) || 0;\n  const apr = parseFloat(L.apr) || 0;\n  const start = new Date(L.date + 'T00:00:00').getTime();\n  const days = Math.max(0, (Date.now() - start) / 86400000);\n  const accrued = principal * (apr / 100) * (days / 365);\n  const debt = principal + accrued;\n  const collValue = collateral * btcPriceUSD;\n  const ltv = collValue > 0 ? (debt / collValue) * 100 : 0;\n  const btcKept = loanPrice > 0 ? principal / loanPrice : 0;\n  const pnl = btcKept * (btcPriceUSD - loanPrice) - accrued;\n  return { collateral, principal, loanPrice, apr, days, accrued, debt, collValue, ltv, btcKept, pnl };\n}\n\nfunction totalLoanDebt() {\n  let d = 0;\n  for (const L of loans) d += loanCalc(L).debt;\n  return d;\n}\n\nfunction updateDebtChip() {\n  const chip = document.getElementById('debt-chip');\n  if (!chip) return;\n  const d = totalLoanDebt();\n  if (d > 0 && btcPriceUSD > 0) {\n    chip.style.display = 'inline-flex';\n    chip.textContent = t('totalDebt') + ' −' + fVal(d);\n  } else {\n    chip.style.display = 'none';\n  }\n}\n\nfunction renderLoans() {\n  const el = document.getElementById('loan-list');\n  if (!el) return;\n  if (!loans.length) {\n    el.innerHTML = '<div class=\"wallet-empty\">' + t('loansEmpty') + '<\u002Fdiv>';\n    updateDebtChip();\n    return;\n  }\n  const hasPrice = btcPriceUSD > 0;\n  el.innerHTML = loans.map(L => {\n    const c = loanCalc(L);\n    const ltvCol = c.ltv >= 70 ? 'var(--red)' : c.ltv >= 50 ? 'var(--btc)' : 'var(--green)';\n    const liq = parseFloat(L.liqPrice) || 0;\n    const drop = hasPrice && liq > 0 ? ((btcPriceUSD - liq) / btcPriceUSD) * 100 : null;\n    const liqCol = drop != null && drop < 20 ? 'var(--red)' : 'var(--text)';\n    const pnlBtc = hasPrice ? c.pnl / btcPriceUSD : 0;\n    return `<div class=\"loan-item\">\n      <div class=\"loan-head\">\n        <div>\n          <div class=\"wallet-name\">${escapeHtml(L.name || 'Loan')}<\u002Fdiv>\n          <div class=\"wallet-pct\">${fDate(L.date)} · ${Math.floor(c.days)} ${t('daysLab')} · ${c.apr}${t('aprSuffix')} · ${t('lPrice')}: ${fUSD(c.loanPrice)}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:2px;\">\n          <button class=\"tx-del\" onclick=\"editLoan('${L.id}')\" title=\"✎\">✎<\u002Fbutton>\n          <button class=\"tx-del\" onclick=\"deleteLoan('${L.id}')\" title=\"✕\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"loan-metrics\">\n        <div>\n          <div class=\"hm-label\">${t('collateralLab')}<\u002Fdiv>\n          <div class=\"hm-value\">${fBTC(c.collateral)}<\u002Fdiv>\n          <div class=\"hm-sub\">${hasPrice ? fVal(c.collValue) : ''}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"hm-label\">${t('debtToday')}<\u002Fdiv>\n          <div class=\"hm-value\">${fUSD(c.debt)}<\u002Fdiv>\n          <div class=\"hm-sub\">+${fUSD(c.accrued)} ${t('accruedLab')}<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"hm-label\">${t('ltvLab')}<\u002Fdiv>\n          <div class=\"hm-value\" style=\"color:${ltvCol}\">${hasPrice ? c.ltv.toFixed(1) + '%' : '—'}<\u002Fdiv>\n        <\u002Fdiv>\n        ${liq > 0 ? `<div>\n          <div class=\"hm-label\">${t('liqLab')}<\u002Fdiv>\n          <div class=\"hm-value\" style=\"color:${liqCol}\">${fUSD(liq)}<\u002Fdiv>\n          <div class=\"hm-sub\">${drop != null ? '−' + drop.toFixed(1) + '%' : ''}<\u002Fdiv>\n        <\u002Fdiv>` : ''}\n        <div>\n          <div class=\"hm-label\">${t('pnlVsSell')}<\u002Fdiv>\n          <div class=\"hm-value ${c.pnl >= 0 ? 'pos' : 'neg'}\">${hasPrice ? (c.pnl >= 0 ? '+' : '') + fUSD(c.pnl) : '—'}<\u002Fdiv>\n          <div class=\"hm-sub\">${hasPrice ? (pnlBtc >= 0 ? '+' : '') + fBTC(pnlBtc) : ''}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join('');\n  updateDebtChip();\n}\n\nfunction addLoan() {\n  const name = document.getElementById('loan-name').value.trim();\n  const collateral = parseFloat(document.getElementById('loan-coll').value) || 0;\n  const principal = parseFloat(document.getElementById('loan-usd').value) || 0;\n  let loanPrice = parseFloat(document.getElementById('loan-price').value) || 0;\n  const apr = parseFloat(document.getElementById('loan-apr').value) || 0;\n  const liqPrice = parseFloat(document.getElementById('loan-liq').value) || 0;\n  const date = document.getElementById('loan-date').value || new Date().toISOString().slice(0, 10);\n  const time = document.getElementById('loan-time').value || '';\n  const errEl = document.getElementById('loan-error');\n  errEl.style.display = 'none';\n\n  if (loanPrice <= 0 && btcPriceUSD > 0) loanPrice = btcPriceUSD;\n  if (collateral <= 0 || principal <= 0 || loanPrice <= 0) {\n    errEl.textContent = t('errLoan');\n    errEl.style.display = 'block';\n    return;\n  }\n\n  if (editingLoan) {\n    const L = loans.find(x => x.id === editingLoan);\n    if (L) Object.assign(L, { name, collateral, principal, loanPrice, apr, liqPrice, date, time });\n    editingLoan = null;\n    document.getElementById('t-add-loan').textContent = t('addLoanBtn');\n  } else {\n    loans.push({ id: Date.now().toString(), name, collateral, principal, loanPrice, apr, liqPrice, date, time });\n  }\n  saveLoans();\n  ['loan-name', 'loan-coll', 'loan-usd', 'loan-price', 'loan-apr', 'loan-liq'].forEach(id => document.getElementById(id).value = '');\n  document.getElementById('loan-form').style.display = 'none';\n  renderLoans();\n  renderWallets();\n  drawAll();\n}\n\nfunction deleteLoan(id) {\n  if (!confirm(t('confirmDelLoan'))) return;\n  const L = loans.find(x => x.id === id);\n  if (L) {\n    /* devolve colateral − dívida (em BTC, no preço do momento do fechamento) */\n    const c = loanCalc(L);\n    const px = btcPriceUSD > 0 ? btcPriceUSD : c.loanPrice;\n    const returned = Math.max(0, c.collateral - (px > 0 ? c.debt / px : 0));\n    const rtx = {\n      id: Date.now().toString(),\n      type: 'loan',\n      btc: returned,\n      price: parseFloat(L.loanPrice) || 0,\n      date: L.date,\n      time: L.time || '',\n      note: L.name || ''\n    };\n    transactions.push(rtx);\n    applyCustody(rtx, 1);\n    save();\n  }\n  loans = loans.filter(x => x.id !== id);\n  saveLoans();\n  renderBalances();\n  renderLoans();\n  renderWallets();\n  renderTxList();\n  render();\n  drawAll();\n}\n\nlet editingLoan = null;\n\nfunction editLoan(id) {\n  const L = loans.find(x => x.id === id);\n  if (!L) return;\n  editingLoan = id;\n  document.getElementById('loan-name').value = L.name || '';\n  document.getElementById('loan-coll').value = L.collateral || '';\n  document.getElementById('loan-usd').value = L.principal || '';\n  document.getElementById('loan-price').value = L.loanPrice || '';\n  document.getElementById('loan-apr').value = L.apr || '';\n  document.getElementById('loan-liq').value = L.liqPrice || '';\n  document.getElementById('loan-date').value = L.date || '';\n  document.getElementById('loan-time').value = L.time || '';\n  document.getElementById('loan-form').style.display = 'block';\n  document.getElementById('t-add-loan').textContent = t('updateBtn');\n  scrollToEl('loan-form');\n}\n\n/* ── Math ─────────────────────────────────── */\nfunction calcPortfolio() {\n  let txBtc = 0, txUsd = 0, costBasis = 0, btcBought = 0;\n  for (const tx of transactions) {\n    const btc = parseFloat(tx.btc) || 0;\n    const price = parseFloat(tx.price) || 0;\n    if (tx.type === 'buy')              { txBtc += btc; txUsd -= btc * price; costBasis += btc * price; btcBought += btc; }\n    else if (tx.type === 'sell')        { txBtc -= btc; txUsd += btc * price; }\n    else if (tx.type === 'deposit_btc') { txBtc += btc; }\n    else if (tx.type === 'deposit_usd') { txUsd += price; }\n    else if (tx.type === 'withdraw_usd') { txUsd -= price; }\n    else if (tx.type === 'withdraw_btc') { txBtc -= btc; }\n    else if (tx.type === 'transfer')    { txBtc -= parseFloat(tx.fee) || 0; }\n  }\n  const baseBtc = manualBal.btc !== null ? manualBal.btc : 0;\n  const baseUsd = manualBal.usd !== null ? manualBal.usd : 0;\n  let collBtc = 0, loanDebt = 0;\n  for (const L of loans) { const c = loanCalc(L); collBtc += c.collateral; loanDebt += c.debt; }\n  // A custódia é a fonte da verdade do saldo de BTC: locais + colateral em garantia.\n  const walletSum = wallets.reduce((s, w) => s + (parseFloat(w.btc) || 0), 0);\n  const hasCustody = wallets.length > 0 || loans.length > 0;\n  const btcBal = hasCustody ? walletSum + collBtc : baseBtc + txBtc;\n  const usdBal = baseUsd + txUsd;\n  const manualAvg = (manualBal.avg !== undefined && manualBal.avg !== null) ? manualBal.avg : null;\n  let avgCost;\n  if (manualAvg !== null && baseBtc > 0) {\n    avgCost = (costBasis + baseBtc * manualAvg) / (btcBought + baseBtc);\n  } else if (manualAvg !== null) {\n    avgCost = manualAvg;\n  } else {\n    avgCost = btcBought > 0 ? costBasis / btcBought : 0;\n  }\n  const btcValueUSD = btcBal * btcPriceUSD;\n  const collValueUSD = collBtc * btcPriceUSD;\n  // colateral já está dentro de btcValueUSD — não somar de novo\n  const totalUSD = btcValueUSD + usdBal - loanDebt;\n  const pnl = avgCost > 0 ? (btcPriceUSD - avgCost) * btcBal : 0;\n  const pnlPct = avgCost > 0 ? ((btcPriceUSD - avgCost) / avgCost) * 100 : 0;\n  const custodyDrift = hasCustody ? btcBal - (baseBtc + txBtc) : 0;\n  return { btcBal, usdBal, totalUSD, avgCost, pnl, pnlPct, btcValueUSD, txBtc, txUsd, costBasis, btcBought, collBtc, collValueUSD, loanDebt, custodyDrift };\n}\n\n/* ── Formatting ───────────────────────────── */\nfunction fUSD(v) { return '$ ' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }\nfunction fBRL(v) { return 'R$ ' + (v * brlRate).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }\nfunction fBTC(v) { return v.toFixed(8).replace(/\\.?0+$/, '') + ' BTC'; }\nfunction fDate(iso) {\n  if (!iso) return '';\n  const parts = String(iso).split('-');\n  if (parts.length !== 3) return iso;\n  const [y, m, d] = parts;\n  return lang === 'en' ? `${m}/${d}/${y}` : `${d}/${m}/${y}`;\n}\nfunction fVal(v) {\n  if (unit === 'BTC') return btcPriceUSD > 0 ? fBTC(v / btcPriceUSD) : '—';\n  if (unit === 'SATS') return btcPriceUSD > 0 ? Math.round(v / btcPriceUSD * 1e8).toLocaleString('en-US') + ' sats' : '—';\n  if (unit === 'BRL') return fBRL(v);\n  return fUSD(v);\n}\n\n/* ── Render ───────────────────────────────── */\nfunction render() {\n  if (btcPriceUSD <= 0) return;\n  const p = calcPortfolio();\n\n  const pnlSign = p.pnl >= 0 ? '+' : '';\n  const pnlLabel = pnlSign + (unit === 'BRL' ? fBRL(p.pnl) : fUSD(p.pnl));\n  const avgLabel = p.avgCost > 0 ? (unit === 'BRL' ? fBRL(p.avgCost) : fUSD(p.avgCost)) : '—';\n  const curLabel = unit === 'BRL' ? fBRL(btcPriceUSD) : fUSD(btcPriceUSD);\n\n  document.getElementById('hero-total').textContent = fVal(p.totalUSD);\n\n  const chip = document.getElementById('pnl-chip');\n  if (p.avgCost > 0) {\n    chip.style.display = 'inline-flex';\n    chip.className = 'pnl-chip ' + (p.pnl >= 0 ? 'pos' : 'neg');\n    chip.textContent = (p.pnl >= 0 ? '▲ ' : '▼ ') + pnlLabel + ' (' + pnlSign + p.pnlPct.toFixed(2) + '%)';\n  } else {\n    chip.style.display = 'none';\n  }\n\n  if (editingBal !== 'avg') renderHeroMetrics();\n\n  if (!editingBal) renderBalances();\n  if (!editingWallet) renderWallets();\n  renderLoans();\n\n  const total = p.totalUSD || 1;\n  const btcPct = Math.max(0, Math.min(100, (p.btcValueUSD / total) * 100));\n  document.getElementById('alloc-btc').style.width = btcPct + '%';\n  document.getElementById('alloc-usd').style.width = (100 - btcPct) + '%';\n  document.getElementById('btc-pct-label').textContent = 'BTC ' + btcPct.toFixed(1) + '%';\n  document.getElementById('usd-pct-label').textContent = 'USD ' + (100 - btcPct).toFixed(1) + '%';\n\n  if (!editingTxInline) renderTxList();\n  drawAll();\n  if (IND.loaded || IND.loading) renderIndicatorCards();\n  if (typeof updateCalc === 'function') updateCalc();\n}\n\n/* ── Editable balances ────────────────────── */\nlet editingBal = null;\nlet editCancelled = false;\n\nfunction renderHeroMetrics() {\n  const p = calcPortfolio();\n  const hasPrice = btcPriceUSD > 0;\n  const pnlSign = p.pnl >= 0 ? '+' : '';\n  const pnlLabel = (p.avgCost > 0 && hasPrice)\n    ? pnlSign + (unit === 'BRL' ? fBRL(p.pnl) : fUSD(p.pnl))\n    : '—';\n  const avgLabel = p.avgCost > 0 ? (unit === 'BRL' ? fBRL(p.avgCost) : fUSD(p.avgCost)) : '—';\n  const curLabel = hasPrice ? (unit === 'BRL' ? fBRL(btcPriceUSD) : fUSD(btcPriceUSD)) : '—';\n\n  const avgCell = editingBal === 'avg'\n    ? `<input class=\"bal-input\" id=\"bal-input-avg\" type=\"number\" step=\"0.01\" min=\"0\" style=\"font-size:14px;padding:4px 8px;max-width:160px;\" value=\"${p.avgCost > 0 ? +p.avgCost.toFixed(2) : ''}\" placeholder=\"USD\" onblur=\"commitEditBal('avg')\" onkeydown=\"balKey(event)\" />`\n    : `<span class=\"bal-amt-text\" onclick=\"startEditBal('avg')\" title=\"${t('editAvgTip')}\">${avgLabel}<\u002Fspan><button class=\"bal-edit-btn\" onclick=\"startEditBal('avg')\" title=\"${t('editAvgTip')}\">✎<\u002Fbutton>`;\n\n  const dcaCells = p.costBasis > 0\n    ? `<div><div class=\"hm-label\">${t('investedLab')}<\u002Fdiv><div class=\"hm-value\">${unit === 'BRL' ? fBRL(p.costBasis) : fUSD(p.costBasis)}<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"hm-label\">${t('stackedLab')}<\u002Fdiv><div class=\"hm-value\">${fBTC(p.btcBought)}<\u002Fdiv><\u002Fdiv>`\n    : '';\n\n  document.getElementById('hero-metrics').innerHTML = `\n    <div><div class=\"hm-label\">${t('pnl')}<\u002Fdiv><div class=\"hm-value ${p.pnl >= 0 ? 'pos' : 'neg'}\">${pnlLabel}<\u002Fdiv><\u002Fdiv>\n    <div><div class=\"hm-label\">${t('avg')}<\u002Fdiv><div class=\"hm-value\" style=\"display:flex;align-items:center;gap:6px;\">${avgCell}${Math.abs(p.custodyDrift) > 1e-8 ? `<span class=\"drift-flag\" title=\"${t('driftTip')} (${fBTC(p.custodyDrift)})\">!<\u002Fspan>` : ''}<\u002Fdiv><\u002Fdiv>\n    ${dcaCells}\n    <div><div class=\"hm-label\">${t('btcNow')}<\u002Fdiv><div class=\"hm-value hm-pub\" style=\"color:var(--btc)\">${curLabel}<\u002Fdiv><\u002Fdiv>\n  `;\n\n  const input = document.getElementById('bal-input-avg');\n  if (input) { input.focus(); input.select(); }\n}\n\nfunction renderBalances() {\n  const p = calcPortfolio();\n\n  const btcAmt = editingBal === 'btc'\n    ? `<input class=\"bal-input\" id=\"bal-input-btc\" type=\"number\" step=\"0.00000001\" value=\"${+p.btcBal.toFixed(8)}\" onblur=\"commitEditBal('btc')\" onkeydown=\"balKey(event)\" />`\n    : `<span class=\"bal-amt-text\" onclick=\"startEditBal('btc')\" title=\"${t('editTip')}\">${fBTC(p.btcBal)}<\u002Fspan><button class=\"bal-edit-btn\" onclick=\"startEditBal('btc')\" title=\"${t('editTip')}\">✎<\u002Fbutton>`;\n\n  const usdAmt = editingBal === 'usd'\n    ? `<input class=\"bal-input\" id=\"bal-input-usd\" type=\"number\" step=\"0.01\" value=\"${+p.usdBal.toFixed(2)}\" onblur=\"commitEditBal('usd')\" onkeydown=\"balKey(event)\" />`\n    : `<span class=\"bal-amt-text\" onclick=\"startEditBal('usd')\" title=\"${t('editTip')}\">${fUSD(p.usdBal)}<\u002Fspan><button class=\"bal-edit-btn\" onclick=\"startEditBal('usd')\" title=\"${t('editTip')}\">✎<\u002Fbutton>`;\n\n  document.getElementById('balances-grid').innerHTML = `\n    <div class=\"balance-card is-btc\">\n      <div class=\"balance-head\">\n        <div class=\"balance-icon ic-btc\">₿<\u002Fdiv>\n        <div class=\"balance-name\">${t('bitcoin')}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"balance-amount\">${btcAmt}<\u002Fdiv>\n      <div class=\"balance-equiv\">${btcPriceUSD > 0 ? fVal(p.btcValueUSD) : ''}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"balance-card\">\n      <div class=\"balance-head\">\n        <div class=\"balance-icon ic-usd\">$<\u002Fdiv>\n        <div class=\"balance-name\">${t('dollar')}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"balance-amount\">${usdAmt}<\u002Fdiv>\n      <div class=\"balance-equiv\">${unit === 'BRL' ? fBRL(p.usdBal) : ''}<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n\n  const input = document.getElementById('bal-input-' + editingBal);\n  if (input) { input.focus(); input.select(); }\n}\n\nfunction startEditBal(kind) {\n  editingBal = kind;\n  editCancelled = false;\n  if (kind === 'avg') renderHeroMetrics(); else renderBalances();\n}\n\nfunction balKey(e) {\n  if (e.key === 'Enter') { e.target.blur(); }\n  else if (e.key === 'Escape') { editCancelled = true; e.target.blur(); }\n}\n\nfunction commitEditBal(kind) {\n  const input = document.getElementById('bal-input-' + kind);\n  if (kind === 'avg') {\n    if (!editCancelled && input) {\n      if (input.value === '') {\n        manualBal.avg = null;\n        saveManualBal();\n      } else {\n        const val = parseFloat(input.value);\n        if (!isNaN(val) && val >= 0) {\n          const p = calcPortfolio();\n          const baseBtc = manualBal.btc !== null && manualBal.btc !== undefined ? manualBal.btc : 0;\n          if (baseBtc > 0) {\n            manualBal.avg = (val * (baseBtc + p.btcBought) - p.costBasis) / baseBtc;\n          } else {\n            manualBal.avg = val;\n          }\n          saveManualBal();\n        }\n      }\n    }\n    editingBal = null;\n    editCancelled = false;\n    renderHeroMetrics();\n    render();\n    return;\n  }\n  if (!editCancelled && input && input.value !== '') {\n    const val = parseFloat(input.value);\n    if (!isNaN(val)) {\n      const p = calcPortfolio();\n      if (kind === 'btc') {\n        if (wallets.length) {\n          // Custódia manda: joga a diferença no bucket \"Não alocado\".\n          const delta = val - p.btcBal;\n          if (Math.abs(delta) > 1e-9) {\n            const w = unallocatedWallet(true);\n            w.btc = (parseFloat(w.btc) || 0) + delta;\n            saveWallets();\n          }\n        } else manualBal.btc = val - p.txBtc;\n      }\n      else manualBal.usd = val - p.txUsd;\n      saveManualBal();\n    }\n  }\n  editingBal = null;\n  editCancelled = false;\n  renderBalances();\n  render();\n}\n\nfunction renderTxList() {\n  const el = document.getElementById('tx-list');\n  if (!transactions.length) {\n    el.innerHTML = '<div class=\"empty\"><span class=\"e-icon\">₿<\u002Fspan>' + t('empty') + '<\u002Fdiv>';\n    return;\n  }\n  const labels = { buy: t('labBuy'), sell: t('labSell'), deposit_btc: t('labDepBtc'), deposit_usd: t('labDepUsd'), loan: t('labLoan'), withdraw_usd: t('labWdUsd'), withdraw_btc: t('labWdBtc'), transfer: t('labTransfer') };\n  const icons  = { buy: '↓', sell: '↑', deposit_btc: '↓', deposit_usd: '↓', loan: '◆', withdraw_usd: '↑', withdraw_btc: '↑', transfer: '⇄' };\n  const dotCls = { buy: 'dot-buy', sell: 'dot-sell', deposit_btc: 'dot-dep', deposit_usd: 'dot-dep', loan: 'dot-loan', withdraw_usd: 'dot-sell', withdraw_btc: 'dot-sell', transfer: 'dot-dep' };\n\n  el.innerHTML = '<div class=\"tx-list\">' + [...transactions].reverse().map(tx => {\n    if (tx.id === editingTxInline) {\n      const typeOpts = [['buy', t('typeBuy')], ['sell', t('typeSell')], ['deposit_btc', t('typeDepBtc')], ['deposit_usd', t('typeDepUsd')], ['loan', t('labLoan')], ['withdraw_usd', t('typeWdUsd')], ['withdraw_btc', t('typeWdBtc')], ['transfer', t('typeTransfer')]]\n        .map(o => `<option value=\"${o[0]}\" ${tx.type === o[0] ? 'selected' : ''}>${o[1]}<\u002Foption>`).join('');\n      return `<div class=\"tx-edit-row\">\n        <div class=\"tx-edit-grid\">\n          <div class=\"field\"><label>${t('type')}<\u002Flabel><select id=\"te-type\" onchange=\"teTypeChange()\">${typeOpts}<\u002Fselect><\u002Fdiv>\n          <div class=\"field\"><label>${t('qty')}<\u002Flabel><input id=\"te-btc\" type=\"number\" step=\"0.00000001\" min=\"0\" value=\"${(tx.type === 'deposit_usd' || tx.type === 'withdraw_usd') ? '' : (tx.btc || '')}\" /><\u002Fdiv>\n          <div class=\"field\"><label id=\"te-price-label\">${priceLabelFor(tx.type)}<\u002Flabel><input id=\"te-price\" type=\"number\" step=\"any\" min=\"0\" value=\"${tx.type === 'transfer' ? (tx.fee || '') : (tx.price || '')}\" /><\u002Fdiv>\n          <div class=\"field\"><label>${t('date')}<\u002Flabel><input id=\"te-date\" type=\"date\" value=\"${tx.date || ''}\" /><\u002Fdiv>\n          <div class=\"field\"><label>${t('time')}<\u002Flabel><input id=\"te-time\" type=\"time\" value=\"${tx.time || ''}\" /><\u002Fdiv>\n          <div class=\"field\"><label id=\"te-note-label\">${tx.type === 'transfer' ? t('fromLabel') : t('note')}<\u002Flabel><input id=\"te-note\" type=\"text\" value=\"${escapeHtml(tx.note || '')}\" /><\u002Fdiv>\n          <div class=\"field\" id=\"te-to-wrap\" style=\"${tx.type === 'transfer' ? '' : 'display:none;'}\"><label>${t('toLabel')}<\u002Flabel><input id=\"te-to\" type=\"text\" value=\"${escapeHtml(tx.to || '')}\" /><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tx-edit-actions\">\n          <button class=\"btn-add\" onclick=\"saveEditTx('${tx.id}')\">${t('saveBtn')}<\u002Fbutton>\n          <button class=\"btn-add btn-secondary\" onclick=\"cancelEditTx()\">${t('cancelBtn')}<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"tx-error\" id=\"te-error\"><\u002Fdiv>\n      <\u002Fdiv>`;\n    }\n    const isUsdOnly = tx.type === 'deposit_usd' || tx.type === 'withdraw_usd';\n    const btcStr   = isUsdOnly ? '—' : (tx.type === 'withdraw_btc' ? '− ' : '') + fBTC(parseFloat(tx.btc) || 0);\n    const priceStr = tx.type === 'deposit_usd'  ? fUSD(parseFloat(tx.price) || 0)\n                   : tx.type === 'withdraw_usd' ? '− ' + fUSD(parseFloat(tx.price) || 0)\n                   : tx.type === 'deposit_btc' || tx.type === 'withdraw_btc' ? ''\n                   : tx.type === 'transfer' ? ((parseFloat(tx.fee) || 0) > 0 ? t('feeShort') + ' ' + fBTC(parseFloat(tx.fee)) : '')\n                   : '@ ' + fUSD(parseFloat(tx.price) || 0);\n    const _txBtc = parseFloat(tx.btc) || 0;\n    const _txPrice = parseFloat(tx.price) || 0;\n    const valueStr = (tx.type === 'buy' || tx.type === 'sell' || tx.type === 'loan') && _txBtc && _txPrice\n                   ? (tx.type === 'sell' ? '+ ' : tx.type === 'buy' ? '− ' : '') + fUSD(_txBtc * _txPrice)\n                   : '';    return `<div class=\"tx-item\">\n      <div class=\"tx-dot ${dotCls[tx.type] || 'dot-dep'}\">${icons[tx.type] || '·'}<\u002Fdiv>\n      <div>\n        <div class=\"tx-type\">${labels[tx.type] || tx.type}<\u002Fdiv>\n        <div class=\"tx-meta\">${fDate(tx.date)}${tx.time ? ' ' + tx.time : ''}${tx.type === 'transfer' ? ' · ' + escapeHtml(tx.note || '?') + ' → ' + escapeHtml(tx.to || '?') : (tx.note ? ' · ' + escapeHtml(tx.note) : '')}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tx-amounts\">\n        <div class=\"tx-btc\">${btcStr}<\u002Fdiv>\n        <div class=\"tx-price\">${priceStr}<\u002Fdiv>\n        ${valueStr ? `<div class=\"tx-usd\">${valueStr}<\u002Fdiv>` : ''}\n      <\u002Fdiv>\n      <button class=\"tx-del\" onclick=\"editTx('${tx.id}')\" title=\"✎\">✎<\u002Fbutton>\n      <button class=\"tx-del\" onclick=\"deleteTx('${tx.id}')\" title=\"✕\">✕<\u002Fbutton>\n    <\u002Fdiv>`;\n  }).join('') + '<\u002Fdiv>';\n}\n\n/* ── Interactions ─────────────────────────── */\nfunction setUnit(u) {\n  unit = u;\n  try { localStorage.setItem('btc_portfolio_unit', u); } catch (e) {}\n  document.querySelectorAll('.unit-btn').forEach(b => b.classList.toggle('active', b.dataset.unit === u));\n  render();\n}\n\nfunction priceLabelFor(type) {\n  if (type === 'deposit_usd' || type === 'withdraw_usd') return t('valueUsd');\n  if (type === 'transfer') return t('feeLabel');\n  return t('priceLabel');\n}\n\nfunction onTypeChange() {\n  const type = document.getElementById('tx-type').value;\n  const btcWrap   = document.getElementById('f-btc-wrap');\n  const priceWrap = document.getElementById('f-price-wrap');\n  const priceLabel = document.getElementById('price-label');\n  const priceIn = document.getElementById('tx-price');\n  const isUsd = type === 'deposit_usd' || type === 'withdraw_usd';\n  btcWrap.style.opacity = isUsd ? '0.3' : '1';\n  priceWrap.style.opacity = (type === 'deposit_btc' || type === 'withdraw_btc') ? '0.3' : '1';\n  priceLabel.textContent = priceLabelFor(type);\n  priceIn.placeholder = isUsd ? 'ex: 61000' : type === 'transfer' ? '0.00000000' : '0.00';\n  priceIn.step = type === 'transfer' ? '0.00000001' : '0.01';\n  document.getElementById('f-to-wrap').style.display = type === 'transfer' ? '' : 'none';\n  document.getElementById('t-note').textContent = type === 'transfer' ? t('fromLabel') : t('note');\n}\n\n// Monta o objeto da transação a partir dos campos (formulário ou edição inline).\nfunction readTxFields(p, fallbackDate) {\n  const g = id => document.getElementById(p + id);\n  const type = g('type').value;\n  const num = parseFloat(g('price').value) || 0;\n  const o = {\n    type,\n    btc: (type === 'deposit_usd' || type === 'withdraw_usd') ? 0 : (parseFloat(g('btc').value) || 0),\n    price: type === 'transfer' ? 0 : num,\n    date: g('date').value || fallbackDate,\n    time: g('time').value || '',\n    note: g('note').value.trim()\n  };\n  if (type === 'transfer') { o.fee = num; o.to = (g('to') ? g('to').value.trim() : ''); }\n  else { o.fee = undefined; o.to = undefined; }\n  return o;\n}\n\nfunction addTx() {\n  const o = readTxFields('tx-', new Date().toISOString().slice(0, 10));\n  const errEl = document.getElementById('tx-error');\n  errEl.style.display = 'none';\n  const err = txError(o);\n  if (err) { errEl.textContent = t(err); errEl.style.display = 'block'; return; }\n\n  if (editingTx) {\n    const tx = transactions.find(x => x.id === editingTx);\n    if (tx) { applyCustody(tx, -1); Object.assign(tx, o); applyCustody(tx, 1); }\n    editingTx = null;\n    document.getElementById('t-add-btn').textContent = t('addBtn');\n  } else {\n    const ntx = Object.assign({ id: Date.now().toString() }, o);\n    transactions.push(ntx);\n    applyCustody(ntx, 1);\n  }\n  save();\n  document.getElementById('tx-btc').value   = '';\n  document.getElementById('tx-price').value = '';\n  document.getElementById('tx-note').value  = '';\n  document.getElementById('tx-to').value    = '';\n  render();\n}\n\nlet editingTx = null;\n\nfunction scrollToEl(id) {\n  const el = document.getElementById(id);\n  if (!el) return;\n  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });\n}\n\nfunction editTx(id) {\n  const tx = transactions.find(x => x.id === id);\n  if (!tx) return;\n  editingTxInline = id;\n  renderTxList();\n}\n\nlet editingTxInline = null;\n\nfunction teTypeChange() {\n  const ty = document.getElementById('te-type');\n  const lab = document.getElementById('te-price-label');\n  if (ty && lab) lab.textContent = priceLabelFor(ty.value);\n  const tw = document.getElementById('te-to-wrap');\n  if (tw) tw.style.display = ty && ty.value === 'transfer' ? '' : 'none';\n  const nl = document.getElementById('te-note-label');\n  if (nl) nl.textContent = ty && ty.value === 'transfer' ? t('fromLabel') : t('note');\n}\n\nfunction cancelEditTx() {\n  editingTxInline = null;\n  renderTxList();\n}\n\nfunction saveEditTx(id) {\n  const tx = transactions.find(x => x.id === id);\n  if (!tx) { editingTxInline = null; renderTxList(); return; }\n  const o = readTxFields('te-', tx.date);\n  const errEl = document.getElementById('te-error');\n  errEl.style.display = 'none';\n  const err = txError(o);\n  if (err) { errEl.textContent = t(err); errEl.style.display = 'block'; return; }\n\n  applyCustody(tx, -1);\n  Object.assign(tx, o);\n  applyCustody(tx, 1);\n  editingTxInline = null;\n  save();\n  renderTxList();\n  render();\n}\n\nfunction deleteTx(id) {\n  if (!confirm(t('confirmDel'))) return;\n  editingTxInline = null;\n  const tx = transactions.find(x => x.id === id);\n  if (tx) applyCustody(tx, -1);\n  transactions = transactions.filter(tx => tx.id !== id);\n  save();\n  renderBalances();\n  renderWallets();\n  render();\n}\n\n/* ── Price feed ───────────────────────────── */\n/* Fetch with timeout */\nasync function fetchT(url, ms = 8000) {\n  const ctl = new AbortController();\n  const id = setTimeout(() => ctl.abort(), ms);\n  try {\n    const r = await fetch(url, { signal: ctl.signal });\n    if (!r.ok) throw new Error('http ' + r.status);\n    return await r.json();\n  } finally { clearTimeout(id); }\n}\n\n/* Chart: BTC candles + RSI */\nconst chartState = {\n  tf: '1w',\n  data: {},\n  src: '',\n  hover: null,\n  view: { '4h': 120, '1d': 120, '1w': 104, '1M': 60 }\n};\n\nfunction chartViewCount() {\n  const all = chartState.data[chartState.tf];\n  if (!all) return 0;\n  return Math.max(20, Math.min(chartState.view[chartState.tf] || 120, all.length));\n}\n\nfunction zoomChart(dir) {\n  const all = chartState.data[chartState.tf];\n  const maxN = all ? all.length : 500;\n  let v = chartState.view[chartState.tf] || 120;\n  v = dir > 0 ? Math.round(v * 1.5) : Math.round(v / 1.5);\n  chartState.view[chartState.tf] = Math.max(20, Math.min(maxN, v));\n  chartState.hover = null;\n  drawAll();\n}\nconst CH_PAD_L = 6, CH_PAD_R = 58;\n\nfunction setTf(tfv) {\n  chartState.tf = tfv;\n  chartState.hover = null;\n  document.querySelectorAll('.tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === tfv));\n  loadChart();\n}\n\nfunction aggregateCandles(candles, keyFn) {\n  const out = [];\n  let cur = null, curKey = null;\n  for (const d of candles) {\n    const k = keyFn(d.t);\n    if (k !== curKey) {\n      if (cur) out.push(cur);\n      cur = { t: d.t, o: d.o, h: d.h, l: d.l, c: d.c };\n      curKey = k;\n    } else {\n      cur.h = Math.max(cur.h, d.h);\n      cur.l = Math.min(cur.l, d.l);\n      cur.c = d.c;\n    }\n  }\n  if (cur) out.push(cur);\n  return out;\n}\n\nconst monthKey = ms => { const d = new Date(ms); return d.getUTCFullYear() + '-' + d.getUTCMonth(); };\nconst weekKey = ms => Math.floor(ms / (7 * 86400000));\nconst dayKey = ms => Math.floor(ms / 86400000);\nconst fourHKey = ms => Math.floor(ms / (4 * 3600000));\n\nasync function fetchKlinesMulti(tf) {\n  /* 1) Binance — native intervals */\n  try {\n    const raw = await fetchT('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=' + tf + '&limit=500');\n    return { src: 'Binance', candles: raw.map(k => ({ t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4] })) };\n  } catch (e) {}\n  /* 2) Kraken — native 4h/1d/1w; monthly aggregated */\n  try {\n    const kInt = { '4h': 240, '1d': 1440, '1w': 10080, '1M': 10080 }[tf];\n    const d = await fetchT('https://api.kraken.com/0/public/OHLC?pair=XBTUSD&interval=' + kInt);\n    const key = Object.keys(d.result).find(k => k !== 'last');\n    let candles = d.result[key].map(k => ({ t: k[0] * 1000, o: +k[1], h: +k[2], l: +k[3], c: +k[4] }));\n    if (tf === '1M') candles = aggregateCandles(candles, monthKey);\n    return { src: 'Kraken', candles };\n  } catch (e) {}\n  /* 3) Coinbase Exchange — native 4h/1d; weekly/monthly aggregated */\n  try {\n    const gran = tf === '4h' ? 14400 : 86400;\n    const raw = await fetchT('https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=' + gran);\n    let candles = raw.map(k => ({ t: k[0] * 1000, o: +k[3], h: +k[2], l: +k[1], c: +k[4] })).sort((a, b) => a.t - b.t);\n    if (tf === '1w') candles = aggregateCandles(candles, weekKey);\n    else if (tf === '1M') candles = aggregateCandles(candles, monthKey);\n    return { src: 'Coinbase', candles };\n  } catch (e) {}\n  /* 4) CoinGecko — hourly/daily closes, aggregated */\n  try {\n    const url = tf === '4h'\n      ? 'https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=30'\n      : 'https://api.coingecko.com/api/v3/coins/bitcoin/market_chart?vs_currency=usd&days=365&interval=daily';\n    const d = await fetchT(url);\n    const pts = d.prices.map(p => ({ t: p[0], o: p[1], h: p[1], l: p[1], c: p[1] }));\n    const keyFn = tf === '4h' ? fourHKey : tf === '1d' ? dayKey : tf === '1w' ? weekKey : monthKey;\n    return { src: 'CoinGecko', candles: aggregateCandles(pts, keyFn) };\n  } catch (e) {}\n  return null;\n}\n\nasync function loadChart() {\n  if (!chartState.data[chartState.tf]) {\n    const res = await fetchKlinesMulti(chartState.tf);\n    if (!res || !res.candles || !res.candles.length) {\n      document.getElementById('chart-info').textContent = t('chartFail');\n      return;\n    }\n    chartState.data[chartState.tf] = res.candles;\n    chartState.src = res.src;\n  }\n  drawAll();\n}\n\nfunction calcRSI(closes, period = 14) {\n  const rsi = new Array(closes.length).fill(null);\n  if (closes.length <= period) return rsi;\n  let gain = 0, loss = 0;\n  for (let i = 1; i <= period; i++) {\n    const d = closes[i] - closes[i - 1];\n    if (d >= 0) gain += d; else loss -= d;\n  }\n  let avgG = gain / period, avgL = loss / period;\n  rsi[period] = avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL);\n  for (let i = period + 1; i < closes.length; i++) {\n    const d = closes[i] - closes[i - 1];\n    avgG = (avgG * (period - 1) + Math.max(d, 0)) / period;\n    avgL = (avgL * (period - 1) + Math.max(-d, 0)) / period;\n    rsi[i] = avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL);\n  }\n  return rsi;\n}\n\nfunction setupCanvas(cv, cssH) {\n  const dpr = window.devicePixelRatio || 1;\n  const w = cv.clientWidth || 600;\n  cv.width = w * dpr;\n  cv.height = cssH * dpr;\n  const ctx = cv.getContext('2d');\n  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n  return { ctx, w, h: cssH };\n}\n\nfunction fK(v) {\n  if (v >= 1000) return '$' + (v / 1000).toFixed(v >= 100000 ? 0 : 1) + 'k';\n  return '$' + v.toFixed(0);\n}\n\nfunction fDateShort(ms) {\n  const d = new Date(ms);\n  if (chartState.tf === '4h' || chartState.tf === '1d') {\n    return d.toLocaleDateString(t('locale'), { day: '2-digit', month: 'short' });\n  }\n  return d.toLocaleDateString(t('locale'), { month: 'short', year: '2-digit' });\n}\n\nfunction fDateFull(ms) {\n  const d = new Date(ms);\n  if (chartState.tf === '4h') {\n    return d.toLocaleDateString(t('locale'), { day: '2-digit', month: 'short' }) + ' ' + d.toLocaleTimeString(t('locale'), { hour: '2-digit', minute: '2-digit' });\n  }\n  if (chartState.tf === '1M') {\n    return d.toLocaleDateString(t('locale'), { month: 'short', year: 'numeric' });\n  }\n  return d.toLocaleDateString(t('locale'), { day: '2-digit', month: 'short', year: 'numeric' });\n}\n\nlet showTrades = true;\ntry { showTrades = localStorage.getItem('btc_portfolio_show_trades') !== '0'; } catch (e) {}\n\nfunction toggleTrades() {\n  showTrades = document.getElementById('show-trades').checked;\n  try { localStorage.setItem('btc_portfolio_show_trades', showTrades ? '1' : '0'); } catch (e) {}\n  drawAll();\n}\n\nfunction drawTri(ctx, x, y, size, up, color) {\n  ctx.beginPath();\n  if (up) {\n    ctx.moveTo(x, y - size);\n    ctx.lineTo(x - size, y + size);\n    ctx.lineTo(x + size, y + size);\n  } else {\n    ctx.moveTo(x, y + size);\n    ctx.lineTo(x - size, y - size);\n    ctx.lineTo(x + size, y - size);\n  }\n  ctx.closePath();\n  ctx.fillStyle = color;\n  ctx.fill();\n  ctx.strokeStyle = 'rgba(12,10,7,0.85)';\n  ctx.lineWidth = 1;\n  ctx.stroke();\n}\n\nfunction drawDiamond(ctx, x, y, size, color) {\n  ctx.beginPath();\n  ctx.moveTo(x, y - size);\n  ctx.lineTo(x + size, y);\n  ctx.lineTo(x, y + size);\n  ctx.lineTo(x - size, y);\n  ctx.closePath();\n  ctx.fillStyle = color;\n  ctx.fill();\n  ctx.strokeStyle = 'rgba(12,10,7,0.85)';\n  ctx.lineWidth = 1;\n  ctx.stroke();\n}\n\nfunction evMs(date, time) {\n  return time\n    ? new Date(date + 'T' + time + ':00').getTime()\n    : Date.parse(date + 'T12:00:00Z');\n}\n\nfunction drawTag(ctx, w, h, x, y, text) {\n  ctx.font = '11px \"IBM Plex Mono\", monospace';\n  const tw = ctx.measureText(text).width;\n  const pw = tw + 14, ph = 20, r = 6;\n  let px = x + 12;\n  if (px + pw > w - 4) px = x - 12 - pw;\n  const py = Math.max(4, Math.min(h - ph - 4, y - ph / 2));\n  ctx.beginPath();\n  ctx.moveTo(px + r, py);\n  ctx.arcTo(px + pw, py, px + pw, py + ph, r);\n  ctx.arcTo(px + pw, py + ph, px, py + ph, r);\n  ctx.arcTo(px, py + ph, px, py, r);\n  ctx.arcTo(px, py, px + pw, py, r);\n  ctx.closePath();\n  ctx.fillStyle = 'rgba(15,12,8,0.92)';\n  ctx.fill();\n  ctx.strokeStyle = 'rgba(247,147,26,0.55)';\n  ctx.lineWidth = 1;\n  ctx.stroke();\n  ctx.fillStyle = '#F7931A';\n  ctx.fillText(text, px + 7, py + 14);\n}\n\nfunction drawAll() {\n  const all = chartState.data[chartState.tf];\n  const priceCv = document.getElementById('price-canvas');\n  if (!all || !all.length || !priceCv) return;\n  const view = chartViewCount();\n  const rsiAll = calcRSI(all.map(d => d.c));\n  const data = all.slice(-view);\n  const rsi = rsiAll.slice(-view);\n  drawPriceChart(data);\n  drawRSIChart(data, rsi);\n\n  const info = document.getElementById('chart-info');\n  const i = chartState.hover;\n  if (i != null && data[i]) {\n    const d = data[i];\n    info.textContent = fDateFull(d.t) + ' · O ' + fK(d.o) + ' H ' + fK(d.h) + ' L ' + fK(d.l) + ' C ' + fK(d.c) + (rsi[i] != null ? ' · RSI ' + rsi[i].toFixed(1) : '');\n  } else {\n    info.textContent = chartState.src || '';\n  }\n\n  const last = rsiAll[rsiAll.length - 1];\n  const rv = document.getElementById('rsi-value');\n  if (last != null) {\n    rv.textContent = last.toFixed(1);\n    rv.style.color = last >= 70 ? 'var(--red)' : last <= 30 ? 'var(--green)' : 'var(--text2)';\n    rv.style.fontWeight = '600';\n  }\n}\n\nfunction drawPriceChart(data) {\n  const cv = document.getElementById('price-canvas');\n  const { ctx, w, h } = setupCanvas(cv, 240);\n  ctx.clearRect(0, 0, w, h);\n  const padT = 10, padB = 20;\n  const cw = w - CH_PAD_L - CH_PAD_R, ch = h - padT - padB;\n  let min = Infinity, max = -Infinity;\n  data.forEach(d => { if (d.l < min) min = d.l; if (d.h > max) max = d.h; });\n  const range = (max - min) || 1;\n  const y = v => padT + (max - v) / range * ch;\n  const n = data.length;\n  const step = cw / n;\n\n  ctx.font = '10px \"IBM Plex Mono\", monospace';\n  for (let i = 0; i <= 4; i++) {\n    const v = max - range * i / 4;\n    const yy = y(v);\n    ctx.strokeStyle = 'rgba(244,239,230,0.06)';\n    ctx.beginPath(); ctx.moveTo(CH_PAD_L, yy); ctx.lineTo(CH_PAD_L + cw, yy); ctx.stroke();\n    ctx.fillStyle = '#6E6657';\n    ctx.fillText(fK(v), CH_PAD_L + cw + 6, yy + 3);\n  }\n\n  const tickEvery = Math.max(1, Math.ceil(n / 6));\n  ctx.fillStyle = '#6E6657';\n  for (let i = 0; i < n; i += tickEvery) {\n    const x = CH_PAD_L + step * i + step / 2;\n    ctx.fillText(fDateShort(data[i].t), x - 14, h - 6);\n  }\n\n  const bw = Math.max(2, step * 0.6);\n  data.forEach((d, i) => {\n    const x = CH_PAD_L + step * i + step / 2;\n    const up = d.c >= d.o;\n    const col = up ? '#4ADE80' : '#F87171';\n    ctx.strokeStyle = col;\n    ctx.fillStyle = col;\n    ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.moveTo(x, y(d.h)); ctx.lineTo(x, y(d.l)); ctx.stroke();\n    const yo = y(d.o), yc = y(d.c);\n    ctx.fillRect(x - bw / 2, Math.min(yo, yc), bw, Math.max(1, Math.abs(yc - yo)));\n  });\n\n  /* trade + loan markers */\n  if (showTrades) {\n    const events = [];\n    for (const tx of transactions) {\n      if (tx.type === 'buy' || tx.type === 'sell' || tx.type === 'loan') {\n        events.push({ kind: tx.type, ms: evMs(tx.date, tx.time), price: parseFloat(tx.price) || 0 });\n      }\n    }\n    for (const L of loans) {\n      events.push({ kind: 'loan', ms: evMs(L.date, L.time), price: parseFloat(L.loanPrice) || 0 });\n    }\n    for (const ev of events) {\n      if (isNaN(ev.ms)) continue;\n      let idx = -1;\n      for (let i = 0; i < n; i++) {\n        const next = i + 1 < n ? data[i + 1].t : Infinity;\n        if (ev.ms >= data[i].t && ev.ms < next) { idx = i; break; }\n      }\n      if (idx < 0) continue;\n      const x = CH_PAD_L + step * idx + step / 2;\n      const py = y(ev.price > 0 ? Math.max(min, Math.min(max, ev.price)) : data[idx].c);\n      if (ev.kind === 'buy') drawTri(ctx, x, py, 5, true, '#4ADE80');\n      else if (ev.kind === 'sell') drawTri(ctx, x, py, 5, false, '#F87171');\n      else drawDiamond(ctx, x, py, 5, '#F7931A');\n    }\n  }\n\n  if (chartState.hover != null && data[chartState.hover]) {\n    const x = CH_PAD_L + step * chartState.hover + step / 2;\n    ctx.strokeStyle = 'rgba(247,147,26,0.5)';\n    ctx.setLineDash([4, 4]);\n    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ch); ctx.stroke();\n    ctx.setLineDash([]);\n    const d = data[chartState.hover];\n    const yc = y(d.c);\n    ctx.fillStyle = '#F7931A';\n    ctx.beginPath(); ctx.arc(x, yc, 3, 0, Math.PI * 2); ctx.fill();\n    drawTag(ctx, w, h, x, yc, '$ ' + d.c.toLocaleString('en-US', { maximumFractionDigits: 0 }));\n  }\n}\n\nfunction drawRSIChart(data, rsi) {\n  const cv = document.getElementById('rsi-canvas');\n  const { ctx, w, h } = setupCanvas(cv, 130);\n  ctx.clearRect(0, 0, w, h);\n  const padT = 8, padB = 8;\n  const cw = w - CH_PAD_L - CH_PAD_R, ch = h - padT - padB;\n  const y = v => padT + (100 - v) / 100 * ch;\n  const n = data.length;\n  const step = cw / n;\n\n  /* overbought band 70-80 */\n  ctx.fillStyle = 'rgba(248,113,113,0.10)';\n  ctx.fillRect(CH_PAD_L, y(80), cw, y(70) - y(80));\n  /* oversold band 20-30 */\n  ctx.fillStyle = 'rgba(74,222,128,0.10)';\n  ctx.fillRect(CH_PAD_L, y(30), cw, y(20) - y(30));\n\n  ctx.font = '10px \"IBM Plex Mono\", monospace';\n  [80, 70, 50, 30, 20].forEach(lv => {\n    const yy = y(lv);\n    ctx.strokeStyle = lv === 50 ? 'rgba(244,239,230,0.06)' : (lv >= 70 ? 'rgba(248,113,113,0.25)' : 'rgba(74,222,128,0.25)');\n    ctx.setLineDash(lv === 50 ? [] : [3, 4]);\n    ctx.beginPath(); ctx.moveTo(CH_PAD_L, yy); ctx.lineTo(CH_PAD_L + cw, yy); ctx.stroke();\n    ctx.setLineDash([]);\n    ctx.fillStyle = '#6E6657';\n    ctx.fillText(String(lv), CH_PAD_L + cw + 6, yy + 3);\n  });\n\n  /* band labels */\n  ctx.fillStyle = 'rgba(248,113,113,0.55)';\n  ctx.fillText(t('overbought'), CH_PAD_L + 4, y(75) + 3);\n  ctx.fillStyle = 'rgba(74,222,128,0.55)';\n  ctx.fillText(t('oversold'), CH_PAD_L + 4, y(25) + 3);\n\n  /* RSI line */\n  ctx.strokeStyle = '#F7931A';\n  ctx.lineWidth = 1.6;\n  ctx.beginPath();\n  let started = false;\n  rsi.forEach((v, i) => {\n    if (v == null) return;\n    const x = CH_PAD_L + step * i + step / 2;\n    if (!started) { ctx.moveTo(x, y(v)); started = true; }\n    else ctx.lineTo(x, y(v));\n  });\n  ctx.stroke();\n\n  if (chartState.hover != null) {\n    const x = CH_PAD_L + step * chartState.hover + step / 2;\n    ctx.strokeStyle = 'rgba(247,147,26,0.5)';\n    ctx.setLineDash([4, 4]);\n    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ch); ctx.stroke();\n    ctx.setLineDash([]);\n    const v = rsi[chartState.hover];\n    if (v != null) {\n      ctx.fillStyle = '#F7931A';\n      ctx.beginPath();\n      ctx.arc(x, y(v), 3, 0, Math.PI * 2);\n      ctx.fill();\n      drawTag(ctx, w, h, x, y(v), v.toFixed(1));\n    }\n  }\n}\n\nfunction chartHover(ev) {\n  const all = chartState.data[chartState.tf];\n  if (!all) return;\n  const n = chartViewCount();\n  const rect = ev.currentTarget.getBoundingClientRect();\n  const x = ev.clientX - rect.left;\n  const cw = rect.width - CH_PAD_L - CH_PAD_R;\n  const idx = Math.floor((x - CH_PAD_L) / (cw / n));\n  chartState.hover = (idx >= 0 && idx < n) ? idx : null;\n  drawAll();\n}\n\nfunction chartLeave() {\n  chartState.hover = null;\n  drawAll();\n}\n\n/* Backup */\nconst ENC_ITER = 300000;\n\nfunction bufToB64(buf) {\n  const u = new Uint8Array(buf);\n  let s = '';\n  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));\n  return btoa(s);\n}\n\nfunction b64ToBuf(s) {\n  const bin = atob(s);\n  const u = new Uint8Array(bin.length);\n  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);\n  return u;\n}\n\nasync function deriveBackupKey(pass, salt, iter) {\n  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);\n  return crypto.subtle.deriveKey(\n    { name: 'PBKDF2', salt: salt, iterations: iter || ENC_ITER, hash: 'SHA-256' },\n    km,\n    { name: 'AES-GCM', length: 256 },\n    false,\n    ['encrypt', 'decrypt']\n  );\n}\n\nasync function exportBackup() {\n  const data = {\n    app: 'btc-portfolio',\n    version: 1,\n    exportedAt: new Date().toISOString(),\n    transactions: transactions,\n    manualBal: manualBal,\n    wallets: wallets,\n    loans: loans,\n    lang: lang\n  };\n  const pass = prompt(t('encAsk'));\n  if (pass === null) return; /* cancelado */\n  let payload = JSON.stringify(data, null, 2);\n  let fname = 'btc-portfolio-backup-' + new Date().toISOString().slice(0, 10) + '.json';\n  if (pass) {\n    try {\n      const salt = crypto.getRandomValues(new Uint8Array(16));\n      const iv = crypto.getRandomValues(new Uint8Array(12));\n      const key = await deriveBackupKey(pass, salt, ENC_ITER);\n      const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, new TextEncoder().encode(payload));\n      payload = JSON.stringify({\n        app: 'btc-portfolio',\n        version: 1,\n        encrypted: true,\n        kdf: 'PBKDF2-SHA256',\n        iter: ENC_ITER,\n        salt: bufToB64(salt),\n        iv: bufToB64(iv),\n        data: bufToB64(ct)\n      }, null, 2);\n      fname = 'btc-portfolio-backup-' + new Date().toISOString().slice(0, 10) + '.enc.json';\n    } catch (e) {\n      document.getElementById('backup-msg').textContent = t('encFail');\n      return;\n    }\n  }\n  const blob = new Blob([payload], { type: 'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = fname;\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  setTimeout(() => URL.revokeObjectURL(a.href), 5000);\n  document.getElementById('backup-msg').textContent = pass ? t('exportOkEnc') : t('exportOk');\n  dirty = false;\n  updateDirtyDot();\n}\n\nfunction importBackup(ev) {\n  const file = ev.target.files && ev.target.files[0];\n  ev.target.value = '';\n  if (!file) ret
