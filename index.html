urn;\n  const msg = document.getElementById('backup-msg');\n  const reader = new FileReader();\n  reader.onload = async () => {\n    try {\n      let data = JSON.parse(reader.result);\n      if (data && data.app === 'btc-portfolio' && data.encrypted) {\n        const pass = prompt(t('encAskDec'));\n        if (pass === null) return;\n        try {\n          const key = await deriveBackupKey(pass, b64ToBuf(data.salt), data.iter || ENC_ITER);\n          const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBuf(data.iv) }, key, b64ToBuf(data.data));\n          data = JSON.parse(new TextDecoder().decode(pt));\n        } catch (e) {\n          msg.textContent = t('encWrong');\n          return;\n        }\n      }\n      if (!data || data.app !== 'btc-portfolio' || !Array.isArray(data.transactions)) {\n        msg.textContent = t('importErr');\n        return;\n      }\n      if (!confirm(t('confirmImport'))) return;\n      transactions = data.transactions;\n      manualBal = (data.manualBal && typeof data.manualBal === 'object') ? data.manualBal : { btc: null, usd: null };\n      if (Array.isArray(data.wallets)) { wallets = data.wallets; saveWallets(); }\n      if (Array.isArray(data.loans)) { loans = data.loans; saveLoans(); }\n      normalizeIds();\n      save();\n      saveManualBal();\n      renderBalances();\n      renderWallets();\n      renderLoans();\n      render();\n      msg.textContent = t('importOk');\n    } catch (e) {\n      msg.textContent = t('importErr');\n    }\n  };\n  reader.readAsText(file);\n}\n\n/* ── Privacidade, CSV e indicador de alterações ── */\nlet privacy = false;\ntry { privacy = localStorage.getItem('btc_portfolio_privacy') === '1'; } catch (e) {}\n\nfunction applyPrivacy() {\n  document.body.classList.toggle('privacy', privacy);\n  const b = document.getElementById('priv-btn');\n  if (b) {\n    b.classList.toggle('on', privacy);\n    const s = b.querySelector('.priv-slash');\n    if (s) s.style.display = privacy ? '' : 'none';\n  }\n}\n\nfunction togglePrivacy() {\n  privacy = !privacy;\n  try { localStorage.setItem('btc_portfolio_privacy', privacy ? '1' : '0'); } catch (e) {}\n  applyPrivacy();\n}\n\nfunction updateDirtyDot() {\n  const b = document.getElementById('t-export-btn');\n  if (!b) return;\n  b.innerHTML = t('exportBtn') + (dirty ? ' <span class=\"dirty-dot\"><\u002Fspan>' : '');\n}\n\nfunction exportCsv() {\n  if (!transactions.length) return;\n  const labels = { buy: t('labBuy'), sell: t('labSell'), deposit_btc: t('labDepBtc'), deposit_usd: t('labDepUsd'), loan: t('labLoan') };\n  const rows = [['type', 'label', 'date', 'time', 'btc', 'price_usd', 'value_usd', 'note']];\n  for (const tx of transactions) {\n    const btc = parseFloat(tx.btc) || 0;\n    const price = parseFloat(tx.price) || 0;\n    const val = tx.type === 'deposit_usd' ? price : btc * price;\n    rows.push([\n      tx.type,\n      labels[tx.type] || tx.type,\n      tx.date || '',\n      tx.time || '',\n      tx.type === 'deposit_usd' ? '' : btc,\n      tx.type === 'deposit_btc' || tx.type === 'deposit_usd' ? '' : price,\n      val ? val.toFixed(2) : '',\n      tx.note || ''\n    ]);\n  }\n  const csv = rows.map(r => r.map(c => {\n    const s = String(c);\n    return /[\",\\n]/.test(s) ? '\"' + s.replace(/\"/g, '\"\"') + '\"' : s;\n  }).join(',')).join('\\n');\n  const blob = new Blob(['\\ufeff' + csv], { type: 'text/csv;charset=utf-8' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(blob);\n  a.download = 'btc-portfolio-transactions-' + new Date().toISOString().slice(0, 10) + '.csv';\n  document.body.appendChild(a);\n  a.click();\n  a.remove();\n  setTimeout(() => URL.revokeObjectURL(a.href), 5000);\n  document.getElementById('backup-msg').textContent = t('csvOk');\n}\n\nasync function fetchPrice() {\n  const el = document.getElementById('btc-price');\n  const status = document.getElementById('price-status');\n  el.innerHTML = '<span class=\"spin\">↻<\u002Fspan>';\n\n  const sources = [\n    { name: 'Binance', fn: async () => {\n        const d = await fetchT('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');\n        let rate = null;\n        try { const d2 = await fetchT('https://api.binance.com/api/v3/ticker/price?symbol=USDTBRL'); rate = parseFloat(d2.price); } catch (e) {}\n        return { price: parseFloat(d.price), brl: rate };\n    } },\n    { name: 'Coinbase', fn: async () => {\n        const d = await fetchT('https://api.coinbase.com/v2/prices/BTC-USD/spot');\n        let rate = null;\n        try { const d2 = await fetchT('https://api.coinbase.com/v2/exchange-rates?currency=USD'); rate = parseFloat(d2.data.rates.BRL); } catch (e) {}\n        return { price: parseFloat(d.data.amount), brl: rate };\n    } },\n    { name: 'Kraken', fn: async () => {\n        const d = await fetchT('https://api.kraken.com/0/public/Ticker?pair=XBTUSD');\n        const key = Object.keys(d.result)[0];\n        return { price: parseFloat(d.result[key].c[0]), brl: null };\n    } },\n    { name: 'CoinGecko', fn: async () => {\n        const d = await fetchT('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,brl');\n        return { price: d.bitcoin.usd, brl: d.bitcoin.brl / d.bitcoin.usd };\n    } },\n  ];\n\n  for (const s of sources) {\n    try {\n      const res = await s.fn();\n      if (!res.price || isNaN(res.price)) continue;\n      btcPriceUSD = res.price;\n      if (res.brl && !isNaN(res.brl)) brlRate = res.brl;\n      el.textContent = '$ ' + btcPriceUSD.toLocaleString('en-US', { maximumFractionDigits: 0 });\n      status.textContent = s.name + ' · ' + new Date().toLocaleTimeString(t('locale')) + ' · R$ ' + brlRate.toFixed(2) + '/USD';\n      render();\n      return;\n    } catch (e) {}\n  }\n\n  el.textContent = t('error');\n  status.textContent = t('apiFail');\n}\n\n/* ── Tabs ─────────────────────────────────── */\nlet curTab = 'portfolio';\ntry { curTab = localStorage.getItem('btc_portfolio_tab') || 'portfolio'; } catch (e) {}\nif (!['portfolio', 'indicators', 'calc', 'spiral'].includes(curTab)) curTab = 'portfolio';\n\nfunction setTab(tab) {\n  curTab = tab;\n  try { localStorage.setItem('btc_portfolio_tab', tab); } catch (e) {}\n  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));\n  document.getElementById('view-portfolio').style.display = tab === 'portfolio' ? '' : 'none';\n  document.getElementById('view-indicators').style.display = tab === 'indicators' ? '' : 'none';\n  const vc = document.getElementById('view-calc');\n  if (vc) vc.style.display = tab === 'calc' ? '' : 'none';\n  const vs = document.getElementById('view-spiral');\n  if (vs) vs.style.display = tab === 'spiral' ? '' : 'none';\n  if (tab === 'spiral') {\n    if (typeof showSpiral === 'function') showSpiral();\n  } else if (tab === 'indicators') {\n    if (!IND.loaded && !IND.loading) loadIndicators();\n  } else if (tab === 'calc') {\n    if (typeof updateCalc === 'function') updateCalc();\n  } else {\n    drawAll();\n  }\n}\n\n/* ── Indicators ───────────────────────────── */\nconst GENESIS_MS = Date.UTC(2009, 0, 3);\nconst IND = { loaded: false, loading: false, updatedAt: null, fng: null, cm: null, height: null };\n\nfunction curPx() {\n  if (btcPriceUSD > 0) return btcPriceUSD;\n  const d = chartState.data['1d'];\n  return d && d.length ? d[d.length - 1].c : 0;\n}\n\nfunction ma200() {\n  const d = chartState.data['1d'];\n  if (!d || d.length < 200) return 0;\n  let s = 0;\n  for (let i = d.length - 200; i < d.length; i++) s += d[i].c;\n  return s / 200;\n}\n\nfunction smaDaily(n, mult) {\n  const d = chartState.data['1d'];\n  if (!d || d.length < n) return 0;\n  let s = 0;\n  for (let i = d.length - n; i < d.length; i++) s += d[i].c;\n  return s / n * (mult || 1);\n}\n\nfunction ma200w() {\n  const d = chartState.data['1w'];\n  if (!d || d.length < 200) return 0;\n  let s = 0;\n  for (let i = d.length - 200; i < d.length; i++) s += d[i].c;\n  return s / 200;\n}\n\nfunction fUSD0(v) { return '$ ' + v.toLocaleString('en-US', { maximumFractionDigits: 0 }); }\nfunction fBig(v) {\n  if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + 'T';\n  if (v >= 1e9) return '$' + (v / 1e9).toFixed(0) + 'B';\n  return fUSD0(v);\n}\n\nfunction indChip(cls, label) { return '<span class=\"ind-chip ' + cls + '\">' + label + '<\u002Fspan>'; }\nfunction indLoadingHtml() { return '<div class=\"ind-loading\">' + t('loading') + '<\u002Fdiv>'; }\nfunction indFailHtml() { return '<div class=\"ind-value\" style=\"color:var(--text3)\">—<\u002Fdiv><div class=\"ind-sub\">' + t('indFail') + '<\u002Fdiv>'; }\n\nfunction indShell(el, name, chip, body, desc) {\n  el.innerHTML = '<div class=\"ind-head\"><div class=\"ind-name\">' + name + '<\u002Fdiv>' + (chip || '') + '<\u002Fdiv>'\n    + body\n    + '<div class=\"ind-desc\">' + desc + '<\u002Fdiv>';\n}\n\nfunction indTrackHtml(min, max, val, segs, labels) {\n  const pct = Math.max(0, Math.min(100, (val - min) / (max - min) * 100));\n  const segHtml = segs.map(s => {\n    const l = Math.max(0, (s.from - min) / (max - min) * 100);\n    const r = Math.min(100, (s.to - min) / (max - min) * 100);\n    return '<div class=\"seg\" style=\"left:' + l + '%;width:' + (r - l) + '%;background:' + s.color + ';\"><\u002Fdiv>';\n  }).join('');\n  const lbl = labels && labels.length ? '<div class=\"ind-scale\">' + labels.map(x => '<span>' + x + '<\u002Fspan>').join('') + '<\u002Fdiv>' : '';\n  return '<div class=\"ind-track-wrap\"><div class=\"ind-track\">' + segHtml + '<\u002Fdiv><div class=\"ind-marker\" style=\"left:calc(' + pct.toFixed(2) + '% - 1.5px);\"><\u002Fdiv><\u002Fdiv>' + lbl;\n}\n\nfunction renderIndFng() {\n  const el = document.getElementById('ind-fng');\n  if (!el) return;\n  if (!IND.fng || !IND.fng.length) {\n    indShell(el, t('fngName'), '', IND.loading ? indLoadingHtml() : indFailHtml(), t('fngDesc'));\n    return;\n  }\n  const v = parseInt(IND.fng[0].value, 10);\n  const cls = v < 25 ? ['fng0', 'chip-red'] : v < 45 ? ['fng1', 'chip-orange'] : v < 55 ? ['fng2', 'chip-gray'] : v < 75 ? ['fng3', 'chip-yellow'] : ['fng4', 'chip-green'];\n  const y = IND.fng[1] ? parseInt(IND.fng[1].value, 10) : null;\n  const w = IND.fng[7] ? parseInt(IND.fng[7].value, 10) : null;\n  const segs = [\n    { from: 0, to: 20, color: 'rgba(248,113,113,0.55)' },\n    { from: 20, to: 40, color: 'rgba(247,147,26,0.5)' },\n    { from: 40, to: 60, color: 'rgba(250,204,21,0.42)' },\n    { from: 60, to: 80, color: 'rgba(163,222,128,0.45)' },\n    { from: 80, to: 100, color: 'rgba(74,222,128,0.55)' }\n  ];\n  const body = '<div class=\"ind-value\">' + v + '<span style=\"font-size:14px;color:var(--text3);\"> / 100<\u002Fspan><\u002Fdiv>'\n    + indTrackHtml(0, 100, v, segs, ['0', '25', '50', '75', '100'])\n    + '<div class=\"ind-sub\">' + (y != null ? t('fngYesterday') + ': ' + y : '') + (y != null && w != null ? ' · ' : '') + (w != null ? t('fngWeekAgo') + ': ' + w : '') + '<\u002Fdiv>';\n  indShell(el, t('fngName'), indChip(cls[1], t(cls[0])), body, t('fngDesc'));\n}\n\nfunction renderIndMvrv() {\n  const el = document.getElementById('ind-mvrv');\n  if (!el) return;\n  const px = curPx();\n  if (!IND.cm || !(IND.cm.realized > 0) || !(px > 0)) {\n    indShell(el, t('mvrvName'), '', IND.loading ? indLoadingHtml() : indFailHtml(), t('mvrvDesc'));\n    return;\n  }\n  const mvrv = px / IND.cm.realized;\n  const z = mvrv < 1 ? ['zoneUnder', 'chip-green'] : mvrv < 2.4 ? ['zoneNeutral', 'chip-gray'] : mvrv < 3.7 ? ['zoneHeated', 'chip-orange'] : ['zoneTop', 'chip-red'];\n  const segs = [\n    { from: 0, to: 1, color: 'rgba(74,222,128,0.5)' },\n    { from: 1, to: 2.4, color: 'rgba(244,239,230,0.10)' },\n    { from: 2.4, to: 3.7, color: 'rgba(247,147,26,0.45)' },\n    { from: 3.7, to: 4.5, color: 'rgba(248,113,113,0.55)' }\n  ];\n  const body = '<div class=\"ind-value\">' + mvrv.toFixed(2) + '<\u002Fdiv>'\n    + indTrackHtml(0, 4.5, mvrv, segs, ['0', '4.5+'])\n    + '<div class=\"ind-sub\">' + t('mcapLab') + ': ' + fBig(px * IND.cm.sply) + ' · ' + t('rcapLab') + ': ' + fBig(IND.cm.rcap) + '<\u002Fdiv>';\n  indShell(el, t('mvrvName'), indChip(z[1], t(z[0])), body, t('mvrvDesc'));\n}\n\nfunction renderIndRealized() {\n  const el = document.getElementById('ind-realized');\n  if (!el) return;\n  if (!IND.cm || !(IND.cm.realized > 0)) {\n    indShell(el, t('realizedName'), '', IND.loading ? indLoadingHtml() : indFailHtml(), t('realizedDesc'));\n    return;\n  }\n  const px = curPx();\n  const rp = IND.cm.realized;\n  const dev = px > 0 ? (px / rp - 1) * 100 : null;\n  const c = dev == null ? '' : indChip(dev >= 0 ? 'chip-green' : 'chip-red', t('marketLab') + ' ' + (dev >= 0 ? '+' : '') + dev.toFixed(0) + '%');\n  const body = '<div class=\"ind-value\">' + fUSD0(rp) + '<\u002Fdiv>'\n    + '<div class=\"ind-sub\">' + t('marketLab') + ': ' + (px > 0 ? fUSD0(px) : '—')\n    + (IND.cm.date ? '<br>' + t('dataLab') + ' ' + fDate(IND.cm.date) + ' · CoinMetrics' : '') + '<\u002Fdiv>';\n  indShell(el, t('realizedName'), c, body, t('realizedDesc'));\n}\n\nfunction renderIndMayer() {\n  const el = document.getElementById('ind-mayer');\n  if (!el) return;\n  const px = curPx();\n  const ma = ma200();\n  if (!(px > 0) || !(ma > 0)) {\n    indShell(el, t('mayerName'), '', IND.loading ? indLoadingHtml() : indFailHtml(), t('mayerDesc'));\n    return;\n  }\n  const m = px / ma;\n  const z = m < 0.8 ? ['zoneCheap', 'chip-green'] : m < 2.4 ? ['zoneNeutral', 'chip-gray'] : ['zoneTop', 'chip-red'];\n  const segs = [\n    { from: 0, to: 0.8, color: 'rgba(74,222,128,0.5)' },\n    { from: 0.8, to: 2.4, color: 'rgba(244,239,230,0.10)' },\n    { from: 2.4, to: 3, color: 'rgba(248,113,113,0.55)' }\n  ];\n  const body = '<div class=\"ind-value\">' + m.toFixed(2) + '<\u002Fdiv>'\n    + indTrackHtml(0, 3, m, segs, ['0', '3+'])\n    + '<div class=\"ind-sub\">' + t('ma200Lab') + ': ' + fUSD0(ma) + '<\u002Fdiv>';\n  indShell(el, t('mayerName'), indChip(z[1], t(z[0])), body, t('mayerDesc'));\n}\n\nfunction renderIndPl() {\n  const el = document.getElementById('ind-powerlaw');\n  if (!el) return;\n  const px = curPx();\n  if (!(px > 0)) {\n    indShell(el, t('plName'), '', IND.loading ? indLoadingHtml() : indFailHtml(), t('plDesc'));\n    return;\n  }\n  const days = Math.floor((Date.now() - GENESIS_MS) / 86400000);\n  const fair = 1.0117e-17 * Math.pow(days, 5.82);\n  const dev = (px / fair - 1) * 100;\n  const z = dev < -30 ? ['zoneUnder', 'chip-green'] : dev < 50 ? ['zoneNeutral', 'chip-gray'] : dev < 120 ? ['zoneHeated', 'chip-orange'] : ['zoneTop', 'chip-red'];\n  const segs = [\n    { from: -60, to: -30, color: 'rgba(74,222,128,0.5)' },\n    { from: -30, to: 50, color: 'rgba(244,239,230,0.10)' },\n    { from: 50, to: 120, color: 'rgba(247,147,26,0.45)' },\n    { from: 120, to: 200, color: 'rgba(248,113,113,0.55)' }\n  ];\n  const body = '<div class=\"ind-value\">' + (dev >= 0 ? '+' : '') + dev.toFixed(0) + '%<\u002Fdiv>'\n    + indTrackHtml(-60, 200, dev, segs, ['-60%', '+200%'])\n    + '<div class=\"ind-sub\">' + t('plModel') + ': ' + fUSD0(fair) + ' · ' + t('plDays') + ': ' + days.toLocaleString(t('locale')) + '<\u002Fdiv>';\n  indShell(el, t('plName'), indChip(z[1], t(z[0])), body, t('plDesc'));\n}\n\nfunction renderIndNupl() {\n  const el = document.getElementById('ind-nupl');\n  if (!el) return;\n  const px = curPx();\n  if (!IND.cm || !(IND.cm.realized > 0) || !(px > 0)) {\n    indShell(el, t('nuplName'), '', IND.loading ? indLoadingHtml() : indFailHtml(), t('nuplDesc'));\n    return;\n  }\n  const nupl = 1 - IND.cm.realized / px;\n  const z = nupl < 0 ? ['zoneCapit', 'chip-green'] : nupl < 0.5 ? ['zoneNeutral', 'chip-gray'] : nupl < 0.75 ? ['zoneHeated', 'chip-orange'] : ['zoneEuphoria', 'chip-red'];\n  const segs = [\n    { from: -0.25, to: 0, color: 'rgba(74,222,128,0.5)' },\n    { from: 0, to: 0.5, color: 'rgba(244,239,230,0.10)' },\n    { from: 0.5, to: 0.75, color: 'rgba(247,147,26,0.45)' },\n    { from: 0.75, to: 1, color: 'rgba(248,113,113,0.55)' }\n  ];\n  const body = '<div class=\"ind-value\">' + nupl.toFixed(2) + '<\u002Fdiv>'\n    + indTrackHtml(-0.25, 1, nupl, segs, ['-0.25', '0', '0.5', '1'])\n    + '<div class=\"ind-sub\">' + t('rcapLab') + ': ' + fBig(IND.cm.rcap) + ' · ' + t('mcapLab') + ': ' + fBig(px * IND.cm.sply) + '<\u002Fdiv>';\n  indShell(el, t('nuplName'), indChip(z[1], t(z[0])), body, t('nuplDesc'));\n}\n\nfunction renderIndPiCycle() {\n  const el = document.getElementById('ind-picycle');\n  if (!el) return;\n  const m111 = smaDaily(111);\n  const m350x2 = smaDaily(350, 2);\n  if (!(m111 > 0) || !(m350x2 > 0)) {\n    indShell(el, t('piName'), '', IND.loading ? indLoadingHtml() : indFailHtml(), t('piDesc'));\n    return;\n  }\n  const ratio = m111 / m350x2;\n  const z = ratio < 0.85 ? ['zoneNeutral', 'chip-gray'] : ratio < 1 ? ['piNear', 'chip-orange'] : ['piSignal', 'chip-red'];\n  const segs = [\n    { from: 0.5, to: 0.85, color: 'rgba(244,239,230,0.10)' },\n    { from: 0.85, to: 1, color: 'rgba(247,147,26,0.45)' },\n    { from: 1, to: 1.1, color: 'rgba(248,113,113,0.55)' }\n  ];\n  const body = '<div class=\"ind-value\">' + ratio.toFixed(2) + '<\u002Fdiv>'\n    + indTrackHtml(0.5, 1.1, ratio, segs, ['0.5', '1', '1.1'])\n    + '<div class=\"ind-sub\">111d: ' + fUSD0(m111) + ' · 2×350d: ' + fUSD0(m350x2) + '<\u002Fdiv>';\n  indShell(el, t('piName'), indChip(z[1], t(z[0])), body, t('piDesc'));\n}\n\nfunction renderInd200w() {\n  const el = document.getElementById('ind-ma200w');\n  if (!el) return;\n  const px = curPx();\n  const ma = ma200w();\n  if (!(ma > 0) || !(px > 0)) {\n    indShell(el, t('ma200wName'), '', IND.loading ? indLoadingHtml() : indFailHtml(), t('ma200wDesc'));\n    return;\n  }\n  const dev = (px / ma - 1) * 100;\n  const c = dev < 0\n    ? indChip('chip-green', t('zoneBottom'))\n    : indChip(dev > 200 ? 'chip-red' : 'chip-gray', t('marketLab') + ' +' + dev.toFixed(0) + '%');\n  const body = '<div class=\"ind-value\">' + fUSD0(ma) + '<\u002Fdiv>'\n    + '<div class=\"ind-sub\">' + t('marketLab') + ': ' + fUSD0(px) + ' · ' + t('multipleLab') + ': ' + (px / ma).toFixed(2) + 'x<\u002Fdiv>';\n  indShell(el, t('ma200wName'), c, body, t('ma200wDesc'));\n}\n\nfunction renderIndHalving() {\n  const el = document.getElementById('ind-halving');\n  if (!el) return;\n  if (!IND.height) {\n    indShell(el, t('halvName'), '', IND.loading ? indLoadingHtml() : indFailHtml(), t('halvDesc'));\n    return;\n  }\n  const h = IND.height;\n  const next = Math.ceil(h / 210000) * 210000;\n  const remain = next - h;\n  const days = remain * 10 / 1440;\n  const eta = new Date(Date.now() + days * 86400000);\n  const prog = Math.max(0, Math.min(100, (210000 - remain) / 210000 * 100));\n  const epoch = Math.floor(h / 210000);\n  const reward = 50 / Math.pow(2, epoch);\n  const body = '<div class=\"ind-value\">' + Math.round(days).toLocaleString(t('locale')) + '<span style=\"font-size:14px;color:var(--text3);\"> ' + t('halvDaysLab') + '<\u002Fspan><\u002Fdiv>'\n    + '<div class=\"ind-track-wrap\"><div class=\"ind-track\"><div class=\"seg\" style=\"left:0;width:' + prog.toFixed(1) + '%;background:linear-gradient(90deg,#E07F0A,var(--btc));\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>'\n    + '<div class=\"ind-scale\"><span>' + (next - 210000).toLocaleString(t('locale')) + '<\u002Fspan><span>' + prog.toFixed(1) + '%<\u002Fspan><span>' + next.toLocaleString(t('locale')) + '<\u002Fspan><\u002Fdiv>'\n    + '<div class=\"ind-sub\">' + t('halvBlockLab') + ': ' + h.toLocaleString(t('locale')) + ' · ' + t('halvRemainLab') + ': ' + remain.toLocaleString(t('locale'))\n    + ' · ' + t('halvRewardLab') + ': ' + reward + ' → ' + (reward / 2) + ' BTC · mempool.space<\u002Fdiv>';\n  indShell(el, t('halvName'), indChip('chip-orange', fDate(eta.toISOString().slice(0, 10))), body, t('halvDesc'));\n}\n\nfunction renderIndicatorCards() {\n  if (!document.getElementById('ind-fng')) return;\n  const upd = document.getElementById('ind-updated');\n  if (upd) {\n    upd.textContent = IND.loading ? t('loading')\n      : (IND.updatedAt ? t('indUpdated') + ' ' + IND.updatedAt.toLocaleTimeString(t('locale')) : '');\n  }\n  const rb = document.getElementById('t-ind-refresh');\n  if (rb) rb.disabled = IND.loading;\n  renderIndFng();\n  renderIndMvrv();\n  renderIndRealized();\n  renderIndMayer();\n  renderIndPl();\n  renderIndNupl();\n  renderIndPiCycle();\n  renderInd200w();\n  renderIndHalving();\n}\n\nasync function loadIndicators(force) {\n  if (IND.loading) return;\n  IND.loading = true;\n  if (force) { IND.fng = null; IND.cm = null; IND.height = null; }\n  renderIndicatorCards();\n  const tasks = [];\n  tasks.push(\n    fetchT('https://api.alternative.me/fng/?limit=8').then(d => { IND.fng = d.data; }).catch(e => {})\n  );\n  tasks.push((async () => {\n    if (!chartState.data['1d']) {\n      const res = await fetchKlinesMulti('1d');\n      if (res && res.candles && res.candles.length) chartState.data['1d'] = res.candles;\n    }\n  })().catch(e => {}));\n  tasks.push((async () => {\n    if (!chartState.data['1w']) {\n      const res = await fetchKlinesMulti('1w');\n      if (res && res.candles && res.candles.length) chartState.data['1w'] = res.candles;\n    }\n  })().catch(e => {}));\n  tasks.push((async () => {\n    for (const u of ['https://mempool.space/api/blocks/tip/height', 'https://blockstream.info/api/blocks/tip/height']) {\n      try {\n        const hh = await fetchT(u, 8000);\n        const n = parseInt(hh, 10);\n        if (n > 800000) { IND.height = n; return; }\n      } catch (e) {}\n    }\n  })().catch(e => {}));\n  tasks.push((async () => {\n    const start = new Date(Date.now() - 12 * 86400000).toISOString().slice(0, 10);\n    const d = await fetchT('https://community-api.coinmetrics.io/v4/timeseries/asset-metrics?assets=btc&metrics=CapMrktCurUSD,CapMVRVCur,SplyCur&frequency=1d&start_time=' + start + '&page_size=100');\n    const rows = (d.data || []).filter(r => r.CapMrktCurUSD && r.CapMVRVCur && r.SplyCur);\n    const last = rows[rows.length - 1];\n    if (last) {\n      const mcap = parseFloat(last.CapMrktCurUSD);\n      const mvrvCm = parseFloat(last.CapMVRVCur);\n      const sply = parseFloat(last.SplyCur);\n      if (mcap > 0 && mvrvCm > 0 && sply > 0) {\n        const rcap = mcap / mvrvCm;\n        IND.cm = {\n          mcap: mcap,\n          rcap: rcap,\n          sply: sply,\n          realized: rcap / sply,\n          date: (last.time || '').slice(0, 10)\n        };\n      }\n    }\n  })().catch(e => {}));\n  await Promise.allSettled(tasks);\n  IND.loading = false;\n  IND.loaded = true;\n  IND.updatedAt = new Date();\n  renderIndicatorCards();\n}\n\n/* ── Init ─────────────────────────────────── */\ndocument.getElementById('refresh-btn').addEventListener('click', fetchPrice);\ndocument.getElementById('tx-date').value = new Date().toISOString().slice(0, 10);\ndocument.getElementById('tx-time').value = new Date().toTimeString().slice(0, 5);\ndocument.getElementById('loan-date').value = new Date().toISOString().slice(0, 10);\ndocument.getElementById('loan-time').value = new Date().toTimeString().slice(0, 5);\n\napplyLang();\nrenderBalances();\nrenderWallets();\nrenderLoans();\ndocument.getElementById('show-trades').checked = showTrades;\nloadChart();\nsetTab(curTab);\nsetUnit(unit);\napplyPrivacy();\nupdateDirtyDot();\n\n['price-canvas', 'rsi-canvas'].forEach(id => {\n  const el = document.getElementById(id);\n  el.addEventListener('pointermove', chartHover);\n  el.addEventListener('pointerleave', chartLeave);\n});\n\nlet chartResizeTimer = null;\nwindow.addEventListener('resize', () => {\n  clearTimeout(chartResizeTimer);\n  chartResizeTimer = setTimeout(drawAll, 150);\n});\nwindow.addEventListener('beforeunload', (e) => {\n  if (!dirty) return;\n  e.preventDefault();\n  e.returnValue = '';\n});\n\nfetchPrice();\nsetInterval(fetchPrice, 60000);\n/* indicadores: re-busca as fontes externas a cada 30 min (além do botão ↻) */\nsetInterval(() => {\n  if (IND.loaded && !IND.loading && curTab === 'indicators') loadIndicators(true);\n}, 30 * 60 * 1000);\n<\u002Fscript>\n<script>\n/* ── Calculadoras: Conversor + Simulador de empréstimo ── */\nObject.assign(I18N.pt, {\n  tabCalc: 'Calculadoras',\n  calcConvTitle: 'Conversor BTC / Fiat',\n  calcConvHint: 'Digite em qualquer campo — a conversão acontece nos dois sentidos, no preço atual. A grade abaixo mostra o valor em todas as moedas ao mesmo tempo.',\n  convCrypto: 'Cripto',\n  convFiat: 'Moeda',\n  calcLoanTitle: 'Simulador de empréstimo',\n  calcLoanHint: 'Simule um empréstimo com BTC em colateral antes de pegá-lo: ajuste o LTV alvo e veja preço de liquidação, margin call, distância e juros. Nada é registrado no seu portfólio.',\n  slColl: 'Colateral BTC',\n  slPrice: 'Preço BTC (USD)',\n  slApr: 'Juros anual %',\n  slTerm: 'Prazo (meses)',\n  slMc: 'LTV de margin call %',\n  slLiq: 'LTV de liquidação %',\n  slLtv: 'LTV alvo',\n  slAmount: 'Valor emprestado (USD)',\n  slOutAmount: 'Empréstimo',\n  slOutLtv: 'LTV inicial',\n  slOutLiq: 'Preço de liquidação',\n  slOutMc: 'Preço de margin call',\n  slOutDist: 'Distância à liquidação',\n  slOutInt: 'Juros no período',\n  slOutTotal: 'Total a pagar',\n  slOutMonthly: 'Juros / mês',\n  slHealth: 'Saúde do empréstimo',\n  slScenarios: 'Cenários de preço do BTC',\n  scnChange: 'Variação',\n  scnPrice: 'Preço BTC',\n  scnLtv: 'LTV',\n  scnHealthy: 'saudável',\n  scnMargin: 'margin call',\n  scnLiq: 'liquidado',\n  scnNow: 'agora',\n  scnVar: 'Variação de preço do BTC'\n});\nObject.assign(I18N.en, {\n  tabCalc: 'Calculators',\n  calcConvTitle: 'BTC / Fiat converter',\n  calcConvHint: 'Type in any field — conversion runs both ways at the current price. The grid below shows the amount in every currency at once.',\n  convCrypto: 'Crypto',\n  convFiat: 'Currency',\n  calcLoanTitle: 'Loan simulator',\n  calcLoanHint: 'Simulate a BTC-collateralized loan before taking it: adjust the target LTV and see liquidation price, margin call, distance and interest. Nothing is saved to your portfolio.',\n  slColl: 'BTC collateral',\n  slPrice: 'BTC price (USD)',\n  slApr: 'Annual interest %',\n  slTerm: 'Term (months)',\n  slMc: 'Margin call LTV %',\n  slLiq: 'Liquidation LTV %',\n  slLtv: 'Target LTV',\n  slAmount: 'Borrowed (USD)',\n  slOutAmount: 'Loan',\n  slOutLtv: 'Initial LTV',\n  slOutLiq: 'Liquidation price',\n  slOutMc: 'Margin call price',\n  slOutDist: 'Distance to liquidation',\n  slOutInt: 'Interest (term)',\n  slOutTotal: 'Total to repay',\n  slOutMonthly: 'Interest / mo',\n  slHealth: 'Loan health',\n  slScenarios: 'BTC price scenarios',\n  scnChange: 'Change',\n  scnPrice: 'BTC price',\n  scnLtv: 'LTV',\n  scnHealthy: 'healthy',\n  scnMargin: 'margin call',\n  scnLiq: 'liquidated',\n  scnNow: 'now',\n  scnVar: 'BTC price change'\n});\n\nconst FIAT = {\n  USD: { sym: '$',  loc: 'en-US' },\n  EUR: { sym: '€',  loc: 'de-DE' },\n  BRL: { sym: 'R$', loc: 'pt-BR' },\n  CHF: { sym: 'Fr', loc: 'de-CH' }\n};\n/* taxas relativas ao USD (quanto de cada moeda por 1 USD) */\nlet fiatRates = { USD: 1, EUR: 0.92, BRL: 5.75, CHF: 0.88 };\n\nfunction calcParseNum(v) {\n  const n = parseFloat(String(v).replace(/\\s/g, '').replace(',', '.'));\n  return isNaN(n) ? 0 : n;\n}\nfunction syncFx() { if (brlRate > 0) fiatRates.BRL = brlRate; }\nfunction fFiatAmt(usd, cur) {\n  const f = FIAT[cur];\n  const v = usd * (fiatRates[cur] || 0);\n  return f.sym + ' ' + v.toLocaleString(f.loc, { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n}\n\n/* ── Conversor ── */\nlet convBtc = 1;\nlet convUnit = 'BTC';\nlet convFiatCur = 'USD';\n\nfunction fmtCryptoField(btc) {\n  if (convUnit === 'SATS') return String(Math.round(btc * 1e8));\n  return String(parseFloat(btc.toFixed(8)));\n}\nfunction fmtFiatField(btc) {\n  if (btcPriceUSD <= 0) return '';\n  const usd = btc * btcPriceUSD;\n  return (usd * (fiatRates[convFiatCur] || 0)).toFixed(2);\n}\nfunction setConvUnit(u) {\n  convUnit = u;\n  document.querySelectorAll('[data-cu]').forEach(b => b.classList.toggle('active', b.dataset.cu === u));\n  const cEl = document.getElementById('conv-crypto');\n  if (cEl) cEl.value = convBtc ? fmtCryptoField(convBtc) : '';\n  renderConvBreakdown();\n}\nfunction setConvFiat(c) {\n  convFiatCur = c;\n  document.querySelectorAll('[data-fc]').forEach(b => b.classList.toggle('active', b.dataset.fc === c));\n  syncFx();\n  const fEl = document.getElementById('conv-fiat');\n  if (fEl) fEl.value = fmtFiatField(convBtc);\n  renderConvBreakdown();\n}\nfunction onConvCrypto() {\n  syncFx();\n  const cEl = document.getElementById('conv-crypto');\n  const v = calcParseNum(cEl.value);\n  convBtc = convUnit === 'SATS' ? v / 1e8 : v;\n  const fEl = document.getElementById('conv-fiat');\n  if (fEl && document.activeElement !== fEl) fEl.value = fmtFiatField(convBtc);\n  renderConvBreakdown();\n}\nfunction onConvFiat() {\n  syncFx();\n  const fEl = document.getElementById('conv-fiat');\n  const v = calcParseNum(fEl.value);\n  const usd = (fiatRates[convFiatCur] > 0) ? v / fiatRates[convFiatCur] : 0;\n  convBtc = btcPriceUSD > 0 ? usd / btcPriceUSD : 0;\n  const cEl = document.getElementById('conv-crypto');\n  if (cEl && document.activeElement !== cEl) cEl.value = convBtc ? fmtCryptoField(convBtc) : '';\n  renderConvBreakdown();\n}\nfunction renderConvBreakdown() {\n  const el = document.getElementById('conv-breakdown');\n  if (!el) return;\n  syncFx();\n  const btc = convBtc || 0;\n  const usd = btc * btcPriceUSD;\n  const noPx = btcPriceUSD <= 0;\n  const cells = [\n    { lab: 'BTC',  val: parseFloat(btc.toFixed(8)).toLocaleString('en-US', { maximumFractionDigits: 8 }), btc: true },\n    { lab: 'SATS', val: Math.round(btc * 1e8).toLocaleString('en-US'), btc: true },\n    { lab: 'USD',  val: noPx ? '—' : fFiatAmt(usd, 'USD') },\n    { lab: 'EUR',  val: noPx ? '—' : fFiatAmt(usd, 'EUR') },\n    { lab: 'BRL',  val: noPx ? '—' : fFiatAmt(usd, 'BRL') },\n    { lab: 'CHF',  val: noPx ? '—' : fFiatAmt(usd, 'CHF') }\n  ];\n  el.innerHTML = cells.map(c =>\n    '<div class=\"cb-cell ' + (c.btc ? 'is-btc' : '') + '\"><div class=\"cb-label\">' + c.lab + '<\u002Fdiv><div class=\"cb-val\">' + c.val + '<\u002Fdiv><\u002Fdiv>'\n  ).join('');\n}\nfunction updateConverter() {\n  syncFx();\n  const cEl = document.getElementById('conv-crypto'), fEl = document.getElementById('conv-fiat');\n  if (!cEl) return;\n  const a = document.activeElement;\n  if (a !== cEl) cEl.value = convBtc ? fmtCryptoField(convBtc) : '';\n  if (a !== fEl) fEl.value = fmtFiatField(convBtc);\n  renderConvBreakdown();\n}\n\n/* ── Simulador de empréstimo ── */\nlet loanAmount = 0;\nfunction recalcLoan(src) {\n  const g = id => document.getElementById(id);\n  if (!g('sl-coll')) return;\n  const coll = calcParseNum(g('sl-coll').value);\n  const price = calcParseNum(g('sl-price').value);\n  const apr = calcParseNum(g('sl-apr').value);\n  const term = calcParseNum(g('sl-term').value);\n  const mc = calcParseNum(g('sl-mc').value) || 75;\n  const liq = calcParseNum(g('sl-liq').value) || 85;\n  const collValue = coll * price;\n  let ltv;\n  if (src === 'amount') {\n    loanAmount = calcParseNum(g('sl-amount').value);\n    ltv = collValue > 0 ? loanAmount / collValue * 100 : 0;\n    g('sl-ltv').value = Math.max(5, Math.min(90, Math.round(ltv) || 5));\n  } else {\n    ltv = calcParseNum(g('sl-ltv').value);\n    loanAmount = collValue * ltv / 100;\n    if (document.activeElement !== g('sl-amount')) g('sl-amount').value = loanAmount > 0 ? loanAmount.toFixed(2) : '';\n  }\n  g('sl-ltv-val').textContent = (ltv || 0).toFixed(0) + '%';\n  renderLoanSim(coll, price, loanAmount, ltv, apr, term, mc, liq);\n  renderScenario();\n}\nfunction renderLoanSim(coll, price, amount, ltv, apr, term, mc, liq) {\n  const out = document.getElementById('loan-sim-out');\n  if (!out) return;\n  const ok = coll > 0 && price > 0 && amount > 0;\n  const liqPrice = (coll > 0 && liq > 0) ? amount / (coll * (liq / 100)) : 0;\n  const mcPrice  = (coll > 0 && mc > 0) ? amount / (coll * (mc / 100)) : 0;\n  const dist = (price > 0 && liqPrice > 0) ? (price - liqPrice) / price * 100 : 0;\n  const interest = amount * (apr / 100) * (term / 12);\n  const total = amount + interest;\n  const monthly = amount * (apr / 100) / 12;\n  const ltvCol = ltv >= liq ? 'var(--red)' : ltv >= mc ? 'var(--btc)' : 'var(--green)';\n  const distCol = dist < 20 ? 'var(--red)' : dist < 40 ? 'var(--btc)' : 'var(--green)';\n  const m = (lab, val, style) => '<div><div class=\"hm-label\">' + lab + '<\u002Fdiv><div class=\"hm-value\" ' + (style ? 'style=\"' + style + '\"' : '') + '>' + val + '<\u002Fdiv><\u002Fdiv>';\n  const segs = [\n    { from: 0, to: mc, color: 'rgba(74,222,128,0.5)' },\n    { from: mc, to: liq, color: 'rgba(247,147,26,0.5)' },\n    { from: liq, to: 100, color: 'rgba(248,113,113,0.55)' }\n  ];\n  out.innerHTML =\n    '<div class=\"calc-out-grid\">'\n    + m(t('slOutAmount'), ok ? fUSD0(amount) : '—')\n    + m(t('slOutLtv'), ok ? ltv.toFixed(1) + '%' : '—', 'color:' + ltvCol)\n    + m(t('slOutLiq'), ok ? fUSD0(liqPrice) : '—', 'color:var(--red)')\n    + m(t('slOutMc'), ok ? fUSD0(mcPrice) : '—', 'color:var(--btc)')\n    + m(t('slOutDist'), ok ? '−' + dist.toFixed(1) + '%' : '—', 'color:' + distCol)\n    + m(t('slOutInt'), ok ? fUSD0(interest) : '—')\n    + m(t('slOutTotal'), ok ? fUSD0(total) : '—')\n    + m(t('slOutMonthly'), ok ? fUSD0(monthly) : '—')\n    + '<\u002Fdiv>'\n    + '<div class=\"calc-health\"><div class=\"calc-health-head\"><span>' + t('slHealth') + '<\u002Fspan><span style=\"color:' + ltvCol + '\">' + (ok ? ltv.toFixed(1) + '%' : '—') + '<\u002Fspan><\u002Fdiv>'\n    + indTrackHtml(0, 100, Math.max(0, Math.min(100, ltv || 0)), segs, ['0%', mc + '%', liq + '%', '100%'])\n    + '<\u002Fdiv>';\n}\nconst SCN_PCTS = [1, 0.5, 0.25, 0.1, 0, -0.1, -0.25, -0.5, -0.75];\nfunction renderScenario() {\n  const el = document.getElementById('loan-scenarios');\n  if (!el) return;\n  const g = id => document.getElementById(id);\n  const coll = calcParseNum(g('sl-coll').value);\n  const price = calcParseNum(g('sl-price').value);\n  const mc = calcParseNum(g('sl-mc').value) || 75;\n  const liq = calcParseNum(g('sl-liq').value) || 85;\n  const pct = calcParseNum(g('scn-pct').value);\n  const pv = g('scn-pct-val');\n  if (pv) pv.textContent = (pct > 0 ? '+' : '') + pct.toFixed(0) + '%';\n  const ok = coll > 0 && price > 0 && loanAmount > 0;\n  const np = price * (1 + pct / 100);\n  const ltv = (np > 0 && coll > 0) ? loanAmount / (coll * np) * 100 : 0;\n  const st = !ok ? ['chip-gray', '—']\n    : ltv >= liq ? ['chip-red', t('scnLiq')]\n    : ltv >= mc ? ['chip-orange', t('scnMargin')]\n    : ['chip-green', t('scnHealthy')];\n  const chgCls = pct > 0 ? 'up' : pct < 0 ? 'down' : '';\n  el.innerHTML =\n    '<div class=\"scn-single\">'\n    + '<div><div class=\"cb-label\">' + t('scnChange') + '<\u002Fdiv><div class=\"scn-cell-val scn-chg ' + chgCls + '\">' + (pct > 0 ? '+' : '') + pct.toFixed(0) + '%<\u002Fdiv><\u002Fdiv>'\n    + '<div><div class=\"cb-label\">' + t('scnPrice') + '<\u002Fdiv><div class=\"scn-cell-val\">' + (ok ? fUSD0(np) : '—') + '<\u002Fdiv><\u002Fdiv>'\n    + '<div><div class=\"cb-label\">' + t('scnLtv') + '<\u002Fdiv><div class=\"scn-cell-val\" style=\"color:' + (ok ? (ltv >= liq ? 'var(--red)' : ltv >= mc ? 'var(--btc)' : 'var(--green)') : 'var(--text)') + '\">' + (ok ? ltv.toFixed(1) + '%' : '—') + '<\u002Fdiv><\u002Fdiv>'\n    + '<span class=\"ind-chip ' + st[0] + '\">' + st[1] + '<\u002Fspan>'\n    + '<\u002Fdiv>';\n}\n\nfunction updateCalc() {\n  const pEl = document.getElementById('sl-price');\n  if (pEl && !pEl.value && btcPriceUSD > 0) { pEl.value = Math.round(btcPriceUSD); recalcLoan('slider'); }\n  updateConverter();\n}\nfunction applyCalcLang() {\n  const set = (id, key) => { const e = document.getElementById(id); if (e) e.textContent = t(key); };\n  set('t-tab-calc', 'tabCalc');\n  set('t-calc-conv', 'calcConvTitle'); set('t-calc-conv-hint', 'calcConvHint');\n  set('t-calc-loan', 'calcLoanTitle'); set('t-calc-loan-hint', 'calcLoanHint');\n  set('t-sl-coll', 'slColl'); set('t-sl-price', 'slPrice'); set('t-sl-apr', 'slApr');\n  set('t-sl-term', 'slTerm'); set('t-sl-mc', 'slMc'); set('t-sl-liq', 'slLiq');\n  set('t-sl-ltv', 'slLtv'); set('t-sl-amount', 'slAmount'); set('t-sl-scenarios', 'slScenarios');\n  set('t-scn-lab', 'scnVar');\n  recalcLoan('slider');\n  updateConverter();\n}\n\nasync function fetchFx() {\n  try {\n    const d = await fetchT('https://api.coinbase.com/v2/exchange-rates?currency=USD', 8000);\n    const r = d.data.rates;\n    const eur = parseFloat(r.EUR), brl = parseFloat(r.BRL), chf = parseFloat(r.CHF);\n    if (eur > 0) fiatRates.EUR = eur;\n    if (chf > 0) fiatRates.CHF = chf;\n    if (brl > 0) fiatRates.BRL = brl;\n    updateConverter();\n    return;\n  } catch (e) {}\n  try {\n    const d = await fetchT('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd,eur,brl,chf', 8000);\n    const b = d.bitcoin;\n    if (b && b.usd) {\n      if (b.eur) fiatRates.EUR = b.eur / b.usd;\n      if (b.brl) fiatRates.BRL = b.brl / b.usd;\n      if (b.chf) fiatRates.CHF = b.chf / b.usd;\n      updateConverter();\n    }\n  } catch (e) {}\n}\n\nfunction initCalc() {\n  const cEl = document.getElementById('conv-crypto');\n  if (cEl && !cEl.value) cEl.value = fmtCryptoField(convBtc);\n  const pEl = document.getElementById('sl-price');\n  if (pEl && !pEl.value && btcPriceUSD > 0) pEl.value = Math.round(btcPriceUSD);\n  applyCalcLang();\n}\ninitCalc();\nfetchFx();\nsetInterval(fetchFx, 5 * 60 * 1000);\n<\u002Fscript>\n<script src=\"c59b9ade-93a9-4ba3-ba22-2f37c61119ab\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
